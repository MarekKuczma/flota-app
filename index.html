}
function wyslijWpis(wpis, komunikatId, poSukcesie){
  overlay(true, 'Zapisuję…');
  api({ kod: ls(K.kod), akcja:'zglos', rodzaj:wpis.rodzaj, dotyczy:wpis.dotyczy,
        maszyna:wpis.maszyna, typ:wpis.typ, tresc:wpis.tresc, klucz:wpis.klucz })
  .then(function(d){
    overlay(false);
    if (d.ok){
      pokazKomunikat(komunikatId, 'ok',
        'Zapisane — wpis <b>'+esc(d.s_id)+'</b> czeka w skrzynce na przetworzenie.');
      poSukcesie(); pobierzDane(true);
    } else pokazKomunikat(komunikatId, 'blad', esc(d.blad || 'Nie udało się.'));
    window.scrollTo(0,0);
  }).catch(function(){
    overlay(false);
    dodajDoKolejki(wpis);
    pokazKomunikat(komunikatId, 'uwaga',
      'Brak sieci — wpis zapisany w telefonie (kolejka na Pulsie), wyśle się sam.');

}

  /* typ leci PUSTY — ustala go AI z treści przy imporcie (Zasada #1) */

               typ: '', tresc: tresc, klucz: uuid() },
    'zglosKomunikat', function(){

   ================================================================ */
var KLUCZ_PALETA      = PALETY_APKA.prefiks + '_paleta';
var KLUCZ_MOTYW       = PALETY_APKA.prefiks + '_motyw';
var KLUCZ_PALETY_SPEC = PALETY_APKA.prefiks + '_palety_specjalne';

/* Rejestr WSZYSTKICH palet rodziny — definicje CSS też są we wszystkich
   appkach. O widoczności decyduje PALETY_APKA.podstawowe (podstawowe,
   w kolejności appki) + bramka specjalnych. `pasek` -> <meta theme-color>
   (najciemniejszy odcień nagłówka; wyjątek aurora #4D96FF — świadoma
   decyzja Marka 30.08.2026). Opis "domyślna" dokleja się w locie tej
   palecie, która jest domyślna w danej appce. */
var PALETY_REJESTR = [
  { id:'pomaranczowa', nazwa:'Pomarańcz', opis:'energiczna', pasek:'#f97316',
    probka:'linear-gradient(135deg,#fbbf24,#f97316 55%,#dc2626)' },
  { id:'blekit', nazwa:'Błękit', opis:'spokojniejsza', pasek:'#2563eb',
    probka:'linear-gradient(135deg,#2563eb,#3b82f6 50%,#38bdf8)' },
  { id:'grafit', nazwa:'Grafit', opis:'stonowana', pasek:'#27272a',
    probka:'linear-gradient(135deg,#27272a,#52525b 70%,#a1a1aa)' },
  { id:'burgund', nazwa:'Burgund', opis:'cieplejsza', pasek:'#4c0519',
    probka:'linear-gradient(135deg,#4c0519,#9f1239 55%,#e11d48)' },
  { id:'jadeit', nazwa:'Jadeit', opis:'spokojna zieleń', pasek:'#14532d',
    probka:'linear-gradient(135deg,#22c55e,#7e22ce)' },
  { id:'hot-iron', nazwa:'Hot Iron', opis:'czerwień i bursztyn', pasek:'#7f1d1d',
    probka:'linear-gradient(135deg,#dc2626,#f59e0b)' },
  { id:'widmo', nazwa:'Widmo', opis:'fiolet i czerwień', pasek:'#4c1d95',
    probka:'linear-gradient(135deg,#7c3aed,#ef4444)' },
  { id:'fiord', nazwa:'Fiord', opis:'chłodny turkus', pasek:'#083344',
    probka:'linear-gradient(135deg,#0e7490,#38bdf8,#99f6e4)' },
  { id:'aurora', nazwa:'Aurora', opis:'chłodna poświata', pasek:'#4D96FF',
    probka:'linear-gradient(90deg,#24314A,#4D96FF,#79DFFF,#8A2BE2)', specjalna:true },
  { id:'rgb', nazwa:'Full RGB', opis:'pełne kolory', pasek:'#a855f7',
    probka:'linear-gradient(90deg,#ff2d95,#a855f7,#22d3ee,#22c55e,#facc15)', specjalna:true },
  { id:'gamma', nazwa:'Gamma', opis:'zieleń i fiolet', pasek:'#14532d',
    probka:'linear-gradient(135deg,#14532d,#22c55e 45%,#9333ea)', specjalna:true },
  { id:'heros', nazwa:'Heros', opis:'czerwień i błękit', pasek:'#7f1d1d',
    probka:'linear-gradient(135deg,#7f1d1d,#dc2626 45%,#2563eb)', specjalna:true }
];
function paletaDomyslna_(){
  return (typeof KONFIG !== 'undefined' && KONFIG && KONFIG.PALETA_DOMYSLNA)
    ? KONFIG.PALETA_DOMYSLNA : PALETY_APKA.domyslna;
}
/* PALETY = to, co dana appka w ogóle pokazuje (podstawowe appki w jej
   kolejności + wszystkie specjalne rodziny). Reszta rejestru czeka
   w kodzie — włączenie = dopisanie id do PALETY_APKA.podstawowe. */
var PALETY = PALETY_APKA.podstawowe.map(function(id){
  return PALETY_REJESTR.filter(function(p){ return p.id === id; })[0];
}).concat(PALETY_REJESTR.filter(function(p){ return p.specjalna; }));

function paletaDozwolona_(id){
  var p = PALETY.filter(function(x){ return x.id === id; })[0];
  if (!p) return false;
  return !p.specjalna || localStorage.getItem(KLUCZ_PALETY_SPEC) === 'TAK';
}
/* Migracja starych id (telefon pamięta paletę po id). Mapa per appka.
   `migracjaJednorazowa` (Asystent): mapę wolno puścić tylko raz, bo
   `gamma` zmieniła znaczenie — bez flagi świeżo wybrana fioletowa Gamma
   byłaby cofana przy każdym starcie (złapane testem przy v9). */
function migrujPalety_(){
  var mapa = PALETY_APKA.migracja || {};
  if (PALETY_APKA.migracjaJednorazowa) {
    var KLUCZ_FLAGI = PALETY_APKA.prefiks + '_migracja_palet';
    if (localStorage.getItem(KLUCZ_FLAGI)) return;
    localStorage.setItem(KLUCZ_FLAGI, 'w41');
  }
  var p = localStorage.getItem(KLUCZ_PALETA);
  if (p && mapa[p]) localStorage.setItem(KLUCZ_PALETA, mapa[p]);
}
/* Tryb: jasny / ciemny / auto ("Jak w telefonie"). W localStorage siedzi
   WYBÓR, nie wynik — inaczej po zmianie ustawień telefonu appka
   zostałaby przy starym wyglądzie. */
function wyborMotywu_(){ return localStorage.getItem(KLUCZ_MOTYW) || 'jasny'; }
function motywSystemu_(){
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
    ? 'ciemny' : 'jasny';
}
function motywEfektywny_(){
  var w = wyborMotywu_();
  return w === 'auto' ? motywSystemu_() : w;
}
/* Jedno wejście dla całej appki: ustawia motyw, paletę (z bramką — utrata
   uprawnienia cicho cofa na domyślną), pasek systemowy telefonu
   (theme-color reaguje TYLKO na paletę, nie na tryb — decyzja Marka
   20.07.2026) i odświeża otwarty ekran ustawień. */
function wczytajWyglad(){
  migrujPalety_();
  document.documentElement.setAttribute('data-motyw', motywEfektywny_());
  var p = localStorage.getItem(KLUCZ_PALETA) || paletaDomyslna_();
  if (!paletaDozwolona_(p)) { p = paletaDomyslna_(); localStorage.setItem(KLUCZ_PALETA, p); }
  document.documentElement.setAttribute('data-paleta', p);
  var wybrana = PALETY.filter(function(x){ return x.id === p; })[0] || PALETY[0];
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', wybrana.pasek);
  var ekran = el(PALETY_APKA.ekranUstawienId);
  if (ekran && !ekran.classList.contains('ukryte')) rysujUstawienia_();
}
/* W trybie „auto" wygląd idzie za telefonem NA ŻYWO. */
if (window.matchMedia) {
  var zapytanieMotywu_ = window.matchMedia('(prefers-color-scheme: dark)');
  var naZmianeSystemu_ = function(){ if (wyborMotywu_() === 'auto') wczytajWyglad(); };
  if (zapytanieMotywu_.addEventListener) zapytanieMotywu_.addEventListener('change', naZmianeSystemu_);
  else if (zapytanieMotywu_.addListener) zapytanieMotywu_.addListener(naZmianeSystemu_);
}
/* Ekran „Ustawienia". Lista palet MUSI powstawać przy każdym otwarciu —
   bramka specjalnych decyduje, co w ogóle pokazać, a flaga z serwera
   potrafi się zmienić w trakcie sesji. */
function rysujUstawienia_(){
  var tryb  = wyborMotywu_();
  var teraz = localStorage.getItem(KLUCZ_PALETA) || paletaDomyslna_();
  var widoczne = PALETY.filter(function(p){ return paletaDozwolona_(p.id); });
  var zwykle = widoczne.filter(function(p){ return !p.specjalna; });
  var spec   = widoczne.filter(function(p){ return  p.specjalna; });

  function kafel(p){
    var opis = (p.id === paletaDomyslna_()) ? 'domyślna' : p.opis;
    return '<button type="button" class="pal-poz' + (p.specjalna ? ' spec' : '') +
      (p.id === teraz ? ' wybrana' : '') + '" data-paleta-id="' + p.id + '">' +
      '<span class="probka" style="background:' + p.probka + '"></span>' +
      '<span class="tekst"><b>' + p.nazwa + '</b>' +
      '<span class="opis">' + opis + '</span></span>' +
      '<svg class="ikona ptaszek" viewBox="0 0 24 24" aria-hidden="true">' +
      '<use href="#ic-check"></use></svg></button>';
  }
  function przyciskTrybu(id, ikona, napis){
    return '<button type="button" class="' + (tryb === id ? 'wybrany' : '') +
      '" data-tryb="' + id + '">' + ikonaHTML_(ikona) + napis + '</button>';
  }

  var h = '<h2 class="ekran-baner">Ustawienia</h2>' +
    '<div class="ust-sekcja">Tryb</div><div class="ust-tryb">' +
      przyciskTrybu('jasny',  'ic-sun',   'Jasny') +
      przyciskTrybu('ciemny', 'ic-moon',  'Ciemny') +
      przyciskTrybu('auto',   'ic-phone', 'Jak w telefonie') +
    '</div>' +
    '<div class="ust-sekcja">Paleta</div>' +
    '<div class="pal-lista">' + zwykle.map(kafel).join('') + '</div>';

  /* Cała sekcja specjalnych znika bez uprawnienia — żadnej pustej ramki. */
  if (spec.length) {
    h += '<div class="ust-sekcja">' + ikonaHTML_('ic-lock') + 'Palety specjalne</div>' +
      '<div class="pal-lista">' + spec.map(kafel).join('') + '</div>' +
      '<div class="ust-notka">' + ikonaHTML_('ic-user') +
      '<span>Przyznane Tobie przez Marka — innym osobom te palety się nie pokazują.</span></div>';
  }
  h += '<div class="ust-notka">' + ikonaHTML_('ic-phone') +
    '<span>Wygląd zapamiętuje się w tym telefonie. Na innym urządzeniu ustawisz go osobno.</span></div>';

  el(PALETY_APKA.kartaUstawienId).innerHTML = h;

  el(PALETY_APKA.kartaUstawienId).querySelectorAll('[data-tryb]').forEach(function(b){
    b.onclick = function(){
      localStorage.setItem(KLUCZ_MOTYW, b.dataset.tryb);
      wczytajWyglad();
      rysujUstawienia_();
    };
  });
  el(PALETY_APKA.kartaUstawienId).querySelectorAll('[data-paleta-id]').forEach(function(b){
    b.onclick = function(){
      localStorage.setItem(KLUCZ_PALETA, b.dataset.paletaId);
      wczytajWyglad();
      rysujUstawienia_();
    };
  });
}
wczytajWyglad();
/* ============== KONIEC WSPÓLNEGO BLOKU KANONU (JS) ============== */

/* ---- część appki: sekcja „Konto" pod wspólnym ekranem wyglądu ---- */
function rysujUstawieniaApki(){
  rysujUstawienia_();   /* wspólny blok: tryb + palety (-> #ustawieniaWyglad) */
  var os = dane && dane.osoba || {};
  el('ustawieniaKonto').innerHTML =
    '<div class="h">Konto</div><div class="karta">'+
    '<div class="row" style="cursor:default"><div class="ic">'+I.sprawy+'</div>'+
    '<div class="mid"><div class="t1">'+esc(os.imie||'—')+'</div>'+
    '<div class="t2">rola: '+esc(os.rola||'—')+'</div></div></div>'+
    '<button class="przycisk-drugi" onclick="wyloguj()">Wyloguj z tego telefonu</button></div>'+
    '<div class="stopka-wersji" id="stopkaWersji2"></div>';
  pokazWersje();
}

function overlay(on, tekst){
  el('overlayTekst').textContent = tekst || 'Zapisuję…';
  el('overlay').classList.toggle('on', !!on);
}
function wersjaWorkera(){
  return new Promise(function(res){
    if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return res(null);
    var t = setTimeout(function(){ res(null); }, 800);
    var kanal = new MessageChannel();
    kanal.port1.onmessage = function(e){ clearTimeout(t); res(e.data && e.data.wersja || null); };
    navigator.serviceWorker.controller.postMessage({ typ:'wersja' }, [kanal.port2]);
  });
}
function pokazWersje(){
  wersjaWorkera().then(function(sw){
    wersjaSW = sw || wersjaSW;
    var api = dane && dane.wersjaApi ? 'API '+dane.wersjaApi : 'API —';
    var txt = 'Asystent Floty — '+(wersjaSW || WERSJA_SHELL)+' · '+api;
    ['stopkaWersji','stopkaWersji2'].forEach(function(id){
      var e = el(id); if (e) e.textContent = txt; });
  });
}

/* ---------- rysowanie zbiorcze + start ---------- */
function rysujWszystko(){
  stanSieci = { tryb:'ok', info:null };
  el('kto').textContent = liniaFirmy_(dane.osoba ? dane.osoba.imie+' · '+dane.osoba.rola : '');   // W-49
  el('navKoszty').classList.toggle('ukryte', !dane.koszty);
  document.querySelector('nav').style.setProperty('--zakladki', dane.koszty ? 5 : 4);
  rysujPuls(); rysujSzukaj(); rysujSprawy(); rysujKoszty(); rysujZglos(); rysujUstawieniaApki();
  if (aktualny==='karta') rysujKartaMaszyny();
  if (aktualny==='sprawa') rysujKartaSprawy();
  if (komTrwaly){ var kk = el(komTrwaly.id);
    if (kk){ kk.className = komTrwaly.cls; kk.innerHTML = komTrwaly.html; }
    komTrwaly = null; }
}
function startAplikacji(){
  el('widokLogin').classList.add('ukryte');
  el('widokApp').classList.remove('ukryte');
  rysujWszystko();
  pokaz('puls');
  wyslijKolejke();
}

(function boot(){
  /* v9: jednorazowa migracja starych id palet, potem wygląd z pamięci */
  migrujPalety_();
  wczytajWyglad();
  zbudujNav();

  if ('serviceWorker' in navigator){
    try{ navigator.serviceWorker.register('service-worker.js'); }catch(e){}
  }
  window.addEventListener('online', wyslijKolejke);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && navigator.onLine){ wyslijKolejke();
      if (dane && Date.now() - (dane._pobrano||0) > 120000) pobierzDane(true); }
  });

  /* LINK Z KODEM (wzorzec rodziny): .../asystent-app/#k=XXXX-XXXX-XXXX
     Kod jest NATYCHMIAST czyszczony z paska adresu (replaceState), żeby nie
     został w historii, zakładkach ani na cudzym ekranie przy udostępnianiu.
     Zapamiętany zostaje tylko w tym telefonie, jak przy wpisaniu ręcznym. */
  var zLinku = null;
  try {
    var m = (location.hash + '&' + location.search).match(/[#&?]k=([A-Za-z0-9\-]{8,})/);
    if (m) {
      zLinku = decodeURIComponent(m[1]).toUpperCase();
      history.replaceState(null, '', location.pathname);
    }
  } catch(e){}

  var kod = zLinku || ls(K.kod);
  if (zLinku && zLinku !== ls(K.kod)) {      /* nowy kod z linku wygrywa */
    lsDel(K.dane); dane = null;
    lsSet(K.kod, zLinku);
  }
  if (!kod){ pokazLogin(null); return; }
  /* szybki start z pamieci + ciche odswiezenie */
  var zapisane = ls(K.dane);
  if (zapisane){ try{ dane = JSON.parse(zapisane); }catch(e){ dane = null; } }
  if (dane){ startAplikacji(); pobierzDane(true); }
  else { overlay(true, 'Pobieram dane…');
    pobierzDane().then(function(stan){
      overlay(false);
      if (dane) { startAplikacji(); return; }
      /* 'kod' = komunikat z serwera pokazał już wyloguj() — nie nadpisujemy go
         ogólnikiem o sieci (inaczej zły kod z linku wyglądałby jak brak zasięgu) */
      if (stan !== 'kod')
        pokazLogin(stan === 'siec' ? 'Brak połączenia z siecią — spróbuj ponownie.'
                                   : 'Nie udało się pobrać danych — spróbuj ponownie.');
    }); }
})();
</script>
