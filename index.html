/* KANON PALET (W-41): JEDYNE różnice tej appki wobec Floty i Ewidencji.
   Cała reszta (CSS 12 palet + silnik JS) to blok wspólny, identyczny
   co do znaku w trzech plikach — patrz KANON-PALET.md. */
var PALETY_APKA = {
  prefiks: 'asystent',
  domyslna: 'jadeit',
  podstawowe: ['jadeit', 'hot-iron', 'widmo', 'fiord'],
  migracja: { gamma: 'jadeit', zelazna: 'hot-iron', zorza: 'jadeit' },
  migracjaJednorazowa: true,
  ekranUstawienId: 'ustawieniaWyglad',
  kartaUstawienId: 'ustawieniaWyglad'
};
</script>
<script>
/* KANON PALET — pre-paint (identyczny w 3 appkach): paleta i motyw idą na
   <html> zanim przeglądarka cokolwiek narysuje, bo :root nie niesie już
   żadnej palety. Pełna walidacja (bramka, rejestr) przejdzie w silniku
   niżej w pliku; tu tylko szybki odczyt z localStorage. */
(function(){
  var d = document.documentElement, P = PALETY_APKA;
  try {
    var p = localStorage.getItem(P.prefiks + '_paleta') || P.domyslna;
    /* Mapę migracji wolno tu przyłożyć tylko, gdy silnik jeszcze jej nie
       przeszedł (flaga) — inaczej świeżo wybrana nowa Gamma (fioletowa)
       byłaby na chwilę cofana na Jadeit przy każdym starcie Asystenta. */
    if (P.migracja && P.migracja[p] &&
        !(P.migracjaJednorazowa && localStorage.getItem(P.prefiks + '_migracja_palet')))
      p = P.migracja[p];
    d.setAttribute('data-paleta', p);
    var m = localStorage.getItem(P.prefiks + '_motyw') || 'jasny';
    if (m === 'auto') m = (window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'ciemny' : 'jasny';
    d.setAttribute('data-motyw', m === 'ciemny' ? 'ciemny' : 'jasny');
  } catch (e) {
    d.setAttribute('data-paleta', P.domyslna);
    d.setAttribute('data-motyw', 'jasny');
  }
})();
</script>

/* ---- silnik animacji palet specjalnych — część wspólna ----
   Nazwy @keyframes są GLOBALNE (lekcja W-41 v10: kolizja = ciche
   nadpisanie i kręcące się przyciski) — `plyn`, `obrot`, `przebiegPolysk`
   są zdefiniowane TYLKO tutaj; appka nie może mieć drugiej definicji.
   Tempa rodziny: gamma/heros 11 s, rgb 9 s, aurora 14 s; połysk TYLKO
   w Full RGB. Selektory obejmują elementy wszystkich trzech appek
   (header/.przycisk/.hero) — selektor bez elementu w danej appce po
   prostu nic nie łapie. Reguły dla elementów istniejących tylko w jednej
   appce (avatar, metryki, pasek nawigacji) zostają PO stronie appki. */
@property --kat { syntax:'<angle>'; initial-value:0deg; inherits:true; }
@keyframes obrot { to { --kat:360deg; } }
@keyframes plyn { to { background-position:300% 0; } }
@keyframes przebiegPolysk { 0%{transform:translateX(-130%);} 45%,100%{transform:translateX(130%);} }
[data-paleta="aurora"] header, [data-paleta="aurora"] .przycisk, [data-paleta="aurora"] .hero{
  background-size:300% 100%; animation:plyn 14s linear infinite; }
[data-paleta="rgb"] header, [data-paleta="rgb"] .przycisk, [data-paleta="rgb"] .hero{
  background-size:300% 100%; animation:plyn 9s linear infinite; }
[data-paleta="gamma"] header, [data-paleta="gamma"] .przycisk, [data-paleta="gamma"] .hero,
[data-paleta="heros"] header, [data-paleta="heros"] .przycisk, [data-paleta="heros"] .hero{
  background-size:300% 100%; animation:plyn 11s linear infinite; }
[data-paleta="rgb"] header{position:relative; overflow:hidden;}
[data-paleta="rgb"] header::after{content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(105deg, transparent 36%, rgba(255,255,255,.38) 50%, transparent 64%);
  transform:translateX(-130%); animation:przebiegPolysk 5.5s ease-in-out infinite;}

/* ---- ekran „Ustawienia": tryb + kafle palet — część wspólna ----
   Reguły 1:1 z ewidencji (wzorzec W-31; układ 2x2, próbka na całą
   szerokość kafla, biały ptaszek na próbce). */
.ekran-baner{margin:-16px -16px 14px; padding:11px 14px; text-align:center;
  font-size:15px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; border-radius:14px 14px 0 0;
  background:var(--bg-akcentjasny); color:var(--tekst-akcentjasny);}
.ust-sekcja{font-size:11.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.07em; color:var(--szary); margin:18px 2px 9px;
  display:flex; align-items:center; gap:7px;}
.ust-sekcja:first-of-type{margin-top:2px;}
.ust-sekcja .ikona{width:14px; height:14px;}
.ust-tryb{display:flex; gap:8px;}
.ust-tryb button{flex:1; min-width:0; border:1.5px solid var(--linia);
  background:var(--karta); color:var(--szary); font-family:inherit;
  font-size:12px; font-weight:600; line-height:1.25; padding:11px 3px 9px;
  border-radius:12px; display:flex; flex-direction:column; align-items:center;
  gap:6px; min-height:auto; transition:border-color .2s, color .2s, background .2s;}
.ust-tryb button .ikona{width:19px; height:19px;}
.ust-tryb button.wybrany{border-color:var(--akcent);
  color:var(--tekst-akcentjasny); background:var(--bg-akcentjasny);
  font-weight:700;}
.pal-lista{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
.pal-poz{display:block; width:100%; padding:9px; border-radius:13px;
  border:1.5px solid var(--linia); background:var(--karta); color:var(--tekst);
  font-family:inherit; text-align:left; position:relative; min-height:auto;
  transition:border-color .2s, box-shadow .2s;}
.pal-poz .probka{display:block; width:100%; height:38px; border-radius:9px;
  margin-bottom:7px;}
/* Próbki specjalnych ruszają się już na liście — widać, że są inne,
   zanim się je wybierze. */
.pal-poz.spec .probka{background-size:250% 100%; animation:plyn 5s linear infinite;}
.pal-poz .tekst{display:block;}
.pal-poz b{font-size:13.5px; display:block; line-height:1.2;}
.pal-poz .opis{display:block; font-size:11px; color:var(--szary);}
.pal-poz .ptaszek{position:absolute; top:16px; right:16px; width:20px; height:20px;
  color:#fff; opacity:0; filter:drop-shadow(0 1px 3px rgba(0,0,0,.55));}
.pal-poz.wybrana{border-color:var(--akcent); box-shadow:0 0 0 3px var(--przycisk-cien);}
.pal-poz.wybrana .ptaszek{opacity:1;}
.pal-poz.wybrana b{font-weight:700;}
.ust-notka{font-size:11.5px; color:var(--szary); line-height:1.45;
  margin:11px 2px 0; display:flex; gap:7px; align-items:flex-start;}
.ust-notka .ikona{width:14px; height:14px; flex:none; margin-top:1px; opacity:.7;}
@media (prefers-reduced-motion: reduce){
  .pal-poz.spec .probka{ animation:none; }
}
/* ============== KONIEC WSPÓLNEGO BLOKU KANONU (CSS) ============== */

/* ---- dodatki appki pod wspólny blok ----
   .ikona: baza ikon konturowych ze sprite'u (1:1 z rodziny, Z-82) —
   wspólny ekran ustawień używa <use href="#ic-..."> */
.ikona{width:1em; height:1em; flex:none; vertical-align:-.125em;
   fill:none; stroke:currentColor; stroke-width:1.75;
   stroke-linecap:round; stroke-linejoin:round;}
/* karta sekcji „Wygląd" — .ekran-baner ma marginesy -16px, więc kontener
   musi mieć padding 16px (w rodzinie tak samo) */
#ustawieniaWyglad{background:var(--karta); border:1px solid var(--linia);
   border-radius:14px; padding:16px; margin:12px 0 10px; overflow:hidden;
   box-shadow:var(--cien)}

/* ---- OBRACAJĄCA SIĘ OBWÓDKA PRZYCISKÓW (Z-81, przepisane z Floty) ----
   @property --kat i @keyframes obrot są zdefiniowane WE WSPÓLNYM BLOKU
   KANONU wyżej — tu tylko elementy tej appki, które z nich korzystają. */
.przycisk-glow{position:relative; isolation:isolate; padding:2px; border-radius:16px;
   background:conic-gradient(from var(--kat), var(--stozek));
   animation:obrot 4s linear infinite}
.przycisk-glow::after{content:''; position:absolute; inset:2px; border-radius:14px;
   background:conic-gradient(from var(--kat), var(--stozek));
   filter:blur(13px); opacity:var(--glow-krycie); z-index:-1}
.przycisk-glow .przycisk{margin-top:0}

/* plus w dolnym menu — ta sama obwódka, we WSZYSTKICH paletach */
nav button.zg .plus-glow{width:44px;height:44px;border-radius:50%;margin-top:-16px;
   padding:2px; position:relative; isolation:isolate;
   background:conic-gradient(from var(--kat), var(--stozek));
   animation:obrot 4s linear infinite; box-shadow:0 5px 14px rgba(0,0,0,.22)}
nav button.zg .plus-glow::after{content:''; position:absolute; inset:0; border-radius:50%;
   background:conic-gradient(from var(--kat), var(--stozek));
   filter:blur(10px); opacity:var(--glow-krycie); z-index:-1}

/* kafelki ikon na kartach — obwódka jak .ikona-krag w rodzinie */
.stat, .term{position:relative}

/* ---- PALETY SPECJALNE — płynięcie nagłówka/przycisków/hero i połysk RGB
   siedzą WE WSPÓLNYM BLOKU KANONU wyżej. Tu tylko efekty na elementach,
   które istnieją wyłącznie w tej appce. */
/* ikona w nagłówku i kafelki kategorii: wirujący pierścień */
[data-paleta="aurora"] header img.mark,[data-paleta="gamma"] header img.mark,
[data-paleta="heros"] header img.mark,[data-paleta="rgb"] header img.mark{
   box-shadow:0 0 0 2px transparent, 0 2px 10px rgba(0,0,0,.35);
   outline:2px solid transparent; filter:drop-shadow(0 0 6px rgba(255,255,255,.45))}
/* ⚠ Kafelki RODZAJU pojazdu NIE dostają tęczowej obwódki w paletach
   specjalnych. Kolor kategorii (paleta v93) to informacja, nie ozdoba —
   koparka ma wyglądać tak samo w każdej palecie (uwaga Marka 28.08).
   Efekty palet specjalnych zostają tam, gdzie nic nie znaczą: nagłówek,
   przyciski, wskaźnik nawigacji, liczby na kaflach. */
/* neon pod aktywną zakładką + świecąca ikona (jak w rodzinie) */
[data-paleta="aurora"] nav .wskaznik i,[data-paleta="gamma"] nav .wskaznik i,
[data-paleta="heros"] nav .wskaznik i,[data-paleta="rgb"] nav .wskaznik i{
   box-shadow:0 0 9px var(--akcent-moc)}
[data-paleta="aurora"] nav button.on svg,[data-paleta="gamma"] nav button.on svg,
[data-paleta="heros"] nav button.on svg,[data-paleta="rgb"] nav button.on svg{
   filter:drop-shadow(0 0 6px currentColor)}
/* liczby na kaflach Pulsu: poświata */
[data-paleta="rgb"] .stat .n,[data-paleta="aurora"] .stat .n,
[data-paleta="gamma"] .stat .n,[data-paleta="heros"] .stat .n{
   filter:drop-shadow(0 0 8px rgba(168,85,247,.55))}

/* ---- tryb jasny / ciemny ---- */
:root{--tlo:#f4f6f8; --karta:#ffffff; --tekst:#1f2937; --szary:#6b7280; --linia:#e7eaee;
      --wcisk:#eef1f4; --cien:0 1px 2px rgba(15,23,32,.05);
      --blad:#d93025; --bg-blad:#fce8e6; --ok:#188038; --bg-ok:#e6f4ea;
      --uwaga:#b45309; --bg-uwaga:#fef3c7}
[data-motyw="ciemny"]{--tlo:#101418; --karta:#181e25; --tekst:#e7eaee; --szary:#939ca7;
      --linia:#242c35; --wcisk:#1d242c; --cien:none;
      --blad:#f28b82; --bg-blad:#3a1d1b; --ok:#81c995; --bg-ok:#12291a;
      --uwaga:#fbbf24; --bg-uwaga:#33270e}
   /* ⚠ ŻADNYCH tokenów palety w tym bloku — ciemne wartości KAŻDEJ palety
      (także domyślnego Jadeitu) niesie wspólny blok kanonu wyżej
      ([data-motyw="ciemny"][data-paleta="..."]). Tak znika pułapka Z-91. */

/* ---- ciemne nadpisania palet: WE WSPÓLNYM BLOKU KANONU wyżej ---- */

#app{max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
     background:var(--tlo); position:relative}

/* ---- nagłówek: wariant B (gradient jak we Flocie) — decyzja Marka ---- */
header{background:var(--gradient); color:#fff; padding:13px 14px 11px 16px;
   padding-top:calc(13px + env(safe-area-inset-top));
   display:flex; align-items:center; gap:11px; position:sticky; top:0; z-index:5}
header img.mark{width:38px;height:38px;border-radius:11px;flex:none;display:block;
   box-shadow:0 2px 6px rgba(15,23,32,.3)}
header .naglowek-tekst{min-width:0; flex:1}
header .tt{font-weight:800; font-size:16.5px; letter-spacing:-.2px; line-height:1.15; white-space:nowrap}
header .kto{font-size:10.5px; color:rgba(255,255,255,.85); margin-top:1px}
header .gear{border:0; background:none; color:rgba(255,255,255,.92); cursor:pointer; flex:none;
   width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
   font:inherit}
header .gear svg{width:19px;height:19px;stroke:currentColor}
header .gear:hover,header .gear.on{background:rgba(255,255,255,.18); color:#fff}

/* ---- treść ---- */
main{flex:1; padding:2px 14px 14px; overflow-x:hidden}
.h{font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--szary);
   margin:16px 2px 8px; font-weight:700}
.karta{background:var(--karta); border-radius:14px; padding:12px 14px; margin-bottom:10px;
   border:1px solid var(--linia); box-shadow:var(--cien)}

/* pasek "dane z" + stany sieci (wzorzec .pasek-odswiezania) */
.pasek-sync{display:flex; align-items:center; gap:7px; font-size:10.5px; color:var(--szary);
   padding:9px 4px 0; flex-wrap:wrap}
.pasek-sync b{color:var(--ok); font-weight:600}
.pasek-sync .kropka{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.pasek-sync.offline .kropka{background:#f39c12}
.pasek-sync.blad .kropka{background:var(--blad)}
/* v8: cel dotyku był 56x16 px — palcem się w to nie trafiało (zgłoszenie
   Marka 30.08). Teraz 44 px wysokości, z ikoną i stanem, bo sam tekst „dane z"
   się nie zmienia po odświeżeniu (to data eksportu lustra) i wyglądało to jak
   martwy przycisk. */
.pasek-sync .odsw{margin-left:auto; border:0; background:none; color:var(--akcent);
   font:inherit; font-size:11.5px; font-weight:700; cursor:pointer;
   padding:11px 10px; min-height:44px; display:inline-flex; align-items:center;
   gap:6px; border-radius:10px; -webkit-tap-highlight-color:transparent}
.pasek-sync .odsw:active{background:var(--wcisk)}
.pasek-sync .odsw svg{width:14px; height:14px; stroke:currentColor; fill:none;
   stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
/* ⚠ NIE nazywać tej animacji `obrot` — ta nazwa należy do Z-81 (animuje
   zmienną --kat obwódek conic-gradient). Nazwy @keyframes są GLOBALNE i druga
   definicja nadpisała pierwszą, przez co plus w nawigacji i przycisk „Wyślij"
   kręciły się W CAŁOŚCI (zgłoszenie Marka z telefonu, 30.08.2026).
   `kreciSie` (transform:rotate) już istnieje przy spinnerze zapisu — używamy jej. */
.pasek-sync .odsw.kreci svg{animation:kreciSie .8s linear infinite}

/* ---------- WYBIERAK MASZYNY (Z-8, wariant C „kompakt") ----------
   ⚠ ROZJAZD Z RODZINĄ, ŚWIADOMY: Flota i Ewidencja używają natywnego
   <select>. Tutaj przy 72 maszynach bębenek systemowy nie pozwalał szukać
   ani odróżnić „Develon DX170 (1)" od „(2)" (nie widać VIN-u). Marek wybrał
   wariant kompakt z makiety 30.08.2026. Jeśli się sprawdzi — przenosimy do
   tamtych appek jako JEDEN wspólny kawałek, nie trzy kopie. */
.pole{width:100%; display:flex; align-items:center; gap:11px; border:1px solid var(--linia);
   background:var(--karta); color:var(--tekst); border-radius:12px; padding:11px 12px;
   font:inherit; font-size:14.5px; text-align:left; cursor:pointer; min-height:56px}
.pole .ik{width:34px; height:34px; border-radius:9px; display:flex; align-items:center;
   justify-content:center; flex:none}
.pole .ik svg{width:19px; height:19px}
.pole .ik.pusta{background:var(--wcisk)} .pole .ik.pusta svg{stroke:var(--szary)}
.pole .txt{min-width:0; flex:1}
.pole .txt .a{font-weight:600; line-height:1.25}
/* Z-9: odstęp między rejestracją a marką/modelem (Marek: "za blisko") */
.pole .txt .b{font-size:11.5px; color:var(--szary); margin-top:3px; display:block}
.pole .txt .b.vin{font-family:ui-monospace,Consolas,monospace; font-size:10.5px}
.pole .strz{color:var(--szary); flex:none; font-size:13px}
.pole.pusty .a{color:var(--szary); font-weight:500}

/* panel na całym ekranie — nad nawigacją, dlatego z-index wyżej niż nav */
.wyb{position:fixed; inset:0; background:var(--tlo); z-index:60; display:none;
   flex-direction:column}
.wyb.on{display:flex}
.wyb .top{padding:11px 12px; border-bottom:1px solid var(--linia); background:var(--karta);
   padding-top:calc(11px + env(safe-area-inset-top))}
.wyb .rz{display:flex; gap:8px; align-items:center}
.wyb input[type=search]{flex:1; border:1px solid var(--linia); background:var(--wcisk);
   color:var(--tekst); border-radius:10px; padding:11px 12px; font:inherit;
   font-size:16px; min-width:0}
.wyb input[type=search]:focus{border-color:var(--akcent-moc); outline:none}
.wyb .zamknij{border:0; background:none; color:var(--akcent); font:inherit; font-weight:700;
   font-size:14px; cursor:pointer; padding:10px 4px; min-height:44px}
.wyb .chipy{display:flex; gap:6px; overflow-x:auto; padding:9px 2px 2px; scrollbar-width:none}
.wyb .chipy::-webkit-scrollbar{display:none}
.wyb .chipy .chip{white-space:nowrap; min-height:34px; padding:7px 12px; font-size:11.5px}
.wyb .lista{flex:1; overflow-y:auto; padding:4px 12px calc(12px + env(safe-area-inset-bottom))}
.wyb .grupa{font-size:10.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--szary);
   font-weight:700; margin:14px 2px 5px}
.wyb .grupa:first-child{margin-top:6px}
.wyb .nic{color:var(--szary); font-size:13px; text-align:center; padding:26px 10px}
/* wiersz kompaktowy: kolor rodzaju jako kreska z lewej, model/VIN do prawej.
   Kolory NIE są tu wpisane z ręki — to ta sama paleta v93 co w .ic.k-*, żeby
   koparka miała jeden odcień w całej rodzinie. */
.crow{display:flex; align-items:baseline; gap:9px; padding:9px 4px 9px 11px;
   border-top:1px solid var(--linia); cursor:pointer; position:relative; width:100%;
   text-align:left; font:inherit; color:inherit; background:none; border-left:0;
   border-right:0; border-bottom:0}
.crow:first-of-type{border-top:0}
.crow::before{content:''; position:absolute; left:0; top:9px; bottom:9px; width:3px;
   border-radius:2px; background:#636E72}
.crow.k-kop::before{background:#6AB04C}    .crow.k-osob::before{background:#F0932B}
.crow.k-ciez::before{background:#0984E3}    .crow.k-hds::before{background:#9B59B6}
.crow.k-przycz::before{background:#FD79A8}  .crow.k-bud::before{background:#3FA9B4}
.crow.k-quad::before,.crow.k-inne::before{background:#636E72}
.crow.k-brak::before{background:var(--linia)}
.crow .kl{font-weight:600; font-size:14.5px}
.crow .model{font-size:11.5px; color:var(--szary); margin-left:auto; text-align:right;
   max-width:48%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.crow .model.vin{font-family:ui-monospace,Consolas,monospace; font-size:10.5px}
.crow:focus-visible{outline:2px solid var(--akcent-moc); outline-offset:-2px}

/* kafle pulsu (bez kolorowych ramek — decyzja rundy 3) */
.stats{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.stat{background:var(--karta); border-radius:14px; padding:12px 14px;
   border:1px solid var(--linia); box-shadow:var(--cien)}
.stat .n{font-size:23px; font-weight:800; letter-spacing:-.5px}
.stat .n.uw{color:var(--uwaga)} .stat .n.zl{color:var(--blad)}
.stat .l{font-size:10.5px; color:var(--szary); margin-top:1px; line-height:1.3}

/* wiersze list; kafelek ikony w kolorze kategorii pojazdu (v93) */
.row{display:flex; gap:10px; padding:10px 2px; border-top:1px solid var(--linia);
   align-items:flex-start; cursor:pointer}
.row:first-child{border-top:none}
.row .ic{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;
   justify-content:center;background:var(--wcisk)}
.row .ic svg{width:17px;height:17px;stroke:var(--szary)}
/* Kolory rodzajów — paleta v93 z Panelu Floty (te same, co w Spisie i na QR):
   koparki #6AB04C · osobowe #F0932B · ciężarowe #0984E3 · HDS #9B59B6 ·
   przyczepy #FD79A8 · sprzęt budowlany #7ED6DF · reszta (quad, ciągnik) #636E72 */
.ic.k-kop{background:rgba(106,176,76,.16)}   .ic.k-kop svg{stroke:#6AB04C}
.ic.k-osob{background:rgba(240,147,43,.16)}  .ic.k-osob svg{stroke:#F0932B}
.ic.k-ciez{background:rgba(9,132,227,.14)}   .ic.k-ciez svg{stroke:#0984E3}
.ic.k-hds{background:rgba(155,89,182,.16)}   .ic.k-hds svg{stroke:#9B59B6}
.ic.k-przycz{background:rgba(253,121,168,.16)} .ic.k-przycz svg{stroke:#FD79A8}
.ic.k-bud{background:rgba(126,214,223,.20)}  .ic.k-bud svg{stroke:#3FA9B4}
.ic.k-quad{background:rgba(99,110,114,.16)}  .ic.k-quad svg{stroke:#636E72}
.ic.k-inne{background:rgba(99,110,114,.16)}  .ic.k-inne svg{stroke:#636E72}
[data-motyw="ciemny"] .ic.k-bud svg{stroke:#7ED6DF}
[data-motyw="ciemny"] .ic.k-quad svg,[data-motyw="ciemny"] .ic.k-inne svg{stroke:#9aa3a8}
.row .mid{flex:1; min-width:0}
.row .t1{font-weight:600; font-size:13.5px; line-height:1.3}
.row .t2{font-size:11.5px; color:var(--szary); margin-top:2px; line-height:1.35}
.pill{font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; flex:none}
.pill.red{background:var(--bg-blad); color:var(--blad)}
.pill.amber{background:var(--bg-uwaga); color:var(--uwaga)}
.pill.green{background:var(--bg-ok); color:var(--ok)}
.pill.acc{background:var(--wcisk); color:var(--akcent)}
.pill.szara{background:var(--wcisk); color:var(--szary)}
.pusto{text-align:center; color:var(--szary); padding:18px 8px; font-size:12.5px}
/* Z-10: kafelek sprawy (wariant C z makiety + nazewnictwo jak w wybieraku:
   klucz = rejestracja/nazwa pogrubione, podpis = marka-model/VIN) */
.row .g1{display:flex; align-items:center; gap:8px; min-width:0}
.row .s-klucz{font-weight:700; font-size:13.5px; line-height:1.3; flex:1; min-width:0;
   overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .s-podpis{font-size:11px; color:var(--szary); margin-top:1px; line-height:1.3}
.row .s-podpis.vin{font-family:ui-monospace,Consolas,monospace; font-size:10.5px}
.row .s-opis{font-size:12.5px; line-height:1.4; margin-top:3px;
   display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.row .g3{display:flex; align-items:center; gap:8px; margin-top:4px}
.row .s-nr{font-size:10.5px; color:var(--szary); font-variant-numeric:tabular-nums}
.row .s-ter{font-size:10.5px; font-weight:700; color:var(--uwaga)}
.row .s-ter.red{color:var(--blad)}

/* szukajka */
.szukajka{display:flex; gap:8px; align-items:center; background:var(--karta); border-radius:14px;
   padding:12px 14px; border:1px solid var(--linia); box-shadow:var(--cien); margin:10px 0}
.szukajka svg{width:17px;height:17px;stroke:var(--szary);flex:none}
.szukajka input{border:0; background:none; font:inherit; color:inherit; flex:1; outline:none; min-width:0}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px}
.chip{font-size:11px; padding:5px 11px; border-radius:999px; background:var(--karta);
   border:1px solid var(--linia); color:var(--szary); cursor:pointer; font-family:inherit}
.chip.on{background:var(--akcent); border-color:var(--akcent); color:var(--on-akcent); font-weight:600}
.mrow{display:flex; gap:10px; align-items:center; padding:11px 2px; border-top:1px solid var(--linia); cursor:pointer}
.mrow:first-child{border-top:none}
.mrow .ik{width:28px;height:28px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center}
.mrow .ik svg{width:15px;height:15px}
/* Nazwa maszyny (rejestracja / własna nazwa) jest GŁÓWNA — model to dopisek,
   jak w rodzinie: „WP 6865P — Opel Movano". */
.mrow .nm{flex:1; min-width:0; overflow:hidden}
.mrow .nm b{display:block; font-weight:600; font-size:14px; letter-spacing:-.1px;
   overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mrow .nm .model{display:block; font-size:11px; color:var(--szary); margin-top:1px;
   overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
/* VIN (tylko koparki) — monospace, żeby dało się czytać znak po znaku
   i porównywać z tabliczką na maszynie. */
.mrow .nm .model.vin{font-family:ui-monospace,Consolas,monospace; font-size:10.5px;
   letter-spacing:.2px}
.mrow .reg{font-family:ui-monospace,Consolas,monospace; font-size:10.5px; color:var(--szary);
   background:var(--wcisk); padding:2px 7px; border-radius:6px; flex:none}
.mrow .chev{color:var(--szary); font-size:16px; flex:none}
.grupa{font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--szary);
   font-weight:700; padding:10px 2px 4px; border-top:1px solid var(--linia)}
.karta .grupa:first-child{border-top:none; padding-top:2px}

/* karta maszyny */
.hero{background:var(--gradient); color:var(--on-akcent); border-radius:16px; padding:14px 16px; margin:10px 0}
.hero .back{font-size:12px; opacity:.85; margin-bottom:6px; cursor:pointer; display:inline-flex; gap:5px; align-items:center}
.hero .nm{font-size:19px; font-weight:800; letter-spacing:-.3px}
.hero .meta{display:flex; gap:8px; margin-top:7px; align-items:center; font-size:11px; flex-wrap:wrap}
.hero .reg{font-family:ui-monospace,Consolas,monospace; background:rgba(255,255,255,.18);
   padding:2px 8px; border-radius:6px}
.hero .vin{font-family:ui-monospace,Consolas,monospace; font-size:11px; opacity:.8;
   margin-top:6px; letter-spacing:.3px; word-break:break-all}
.terms{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px}
.term{background:var(--karta); border-radius:12px; padding:9px 6px; text-align:center;
   border:1px solid var(--linia); box-shadow:var(--cien)}
.term .k{font-size:9px; color:var(--szary); text-transform:uppercase; letter-spacing:.4px; font-weight:700}
.term .v{font-size:11.5px; font-weight:700; margin-top:3px}
.term .v.ok{color:var(--ok)} .term .v.nd{color:var(--szary); font-weight:500}
.term .v.uw{color:var(--uwaga)} .term .v.zl{color:var(--blad)}
.term .dni{font-size:9px; color:var(--szary); margin-top:1px}

/* karta sprawy */
.sp-back{font-size:12px; color:var(--szary); cursor:pointer; display:inline-flex; gap:5px;
   align-items:center; margin:10px 0 8px}
.sp-title{display:flex; gap:10px; align-items:flex-start; justify-content:space-between}
.sp-title .t{font-size:16.5px; font-weight:800; letter-spacing:-.2px; line-height:1.25}
.meta2{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:11px}
.meta2 .m{background:var(--wcisk); border-radius:10px; padding:7px 10px}
.meta2 .m .k{font-size:9px; color:var(--szary); text-transform:uppercase; letter-spacing:.5px; font-weight:700}
.meta2 .m .v{font-size:12px; font-weight:600; margin-top:2px; word-break:break-word}
.surowy{margin:0; font-size:12.5px; line-height:1.55; font-style:italic;
   border-left:3px solid var(--akcent-moc); padding:2px 0 2px 11px; white-space:pre-wrap}
.tl{position:relative; padding-left:17px}
.tl::before{content:''; position:absolute; left:4px; top:10px; bottom:12px; width:2px; background:var(--linia)}
.te{position:relative; padding:7px 0}
.te::before{content:''; position:absolute; left:-16.5px; top:13px; width:9px; height:9px;
   border-radius:50%; background:var(--akcent-moc); box-shadow:0 0 0 3px var(--karta)}
.te.czeka::before{background:var(--uwaga)}
.te .td{font-size:10px; color:var(--szary)}
.te .tx{font-size:12.5px; margin-top:2px; line-height:1.45; white-space:pre-wrap}
.te .tx .pill{margin-left:4px}

/* koszty: 3 przekroje */
.seg{display:flex; background:var(--wcisk); border-radius:12px; padding:3px; margin:10px 0}
.seg button{flex:1; border:0; background:none; font:inherit; font-size:11.5px; padding:8px 4px;
   border-radius:9px; color:var(--szary); cursor:pointer; font-weight:600;
   transition:background .2s,color .2s,box-shadow .2s}
.seg button.on{background:var(--karta); color:var(--tekst); font-weight:700; box-shadow:var(--cien)}
.big{font-size:26px; font-weight:800; letter-spacing:-.5px}
.big small{font-size:12px; color:var(--szary); font-weight:500}
.krow{margin:9px 0}
.krow .kl{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; gap:8px}
.krow .kl span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.krow .kl b{font-weight:600; flex:none}
.ktr{height:7px; border-radius:4px; background:var(--wcisk); overflow:hidden}
/* Wykres kosztów „wypełnia się" przy każdym pokazaniu ekranu: paski jadą
   od zera do swojej szerokości (--do). Kolejne słupki startują z opóźnieniem,
   żeby było widać ruch z góry na dół. */
.kfl{height:100%; border-radius:4px; background:var(--grad-maly,var(--gradient));
   width:0; animation:wypelnij .75s cubic-bezier(.25,.9,.35,1) forwards;
   animation-delay:var(--zwloka,0ms)}
@keyframes wypelnij{from{width:0} to{width:var(--do)}}
.kfl.c-kop{background:#6AB04C} .kfl.c-osob{background:#F0932B} .kfl.c-ciez{background:#0984E3}
.kfl.c-hds{background:#9B59B6} .kfl.c-przycz{background:#FD79A8} .kfl.c-bud{background:#7ED6DF}
.kfl.c-quad,.kfl.c-inne{background:#636E72}
.kfl.c-none{background:var(--szary); opacity:.45}
.mon{display:flex; align-items:center; justify-content:space-between; margin:2px 0 8px}
.mon .mn{font-weight:700; font-size:14.5px}
.mon button{width:30px;height:30px;border-radius:9px;background:var(--karta);border:1px solid var(--linia);
   display:flex;align-items:center;justify-content:center;color:var(--szary);cursor:pointer;
   font:inherit;font-size:15px}
.mon button:disabled{opacity:.3; cursor:default}
.mlist .mm{display:flex; justify-content:space-between; align-items:baseline;
   padding:10px 2px; border-top:1px solid var(--linia); cursor:pointer}
.mlist .mm:first-child{border-top:none}
.mlist .mm .n1{font-weight:600; font-size:13.5px}
.mlist .mm .n2{font-size:11px; color:var(--szary)}
.mlist .mm .kw{font-weight:700; font-size:13.5px}

/* formularze */
.f label{display:block; font-size:11px; font-weight:700; color:var(--szary); text-transform:uppercase;
   letter-spacing:.5px; margin:12px 2px 6px}
.f select,.f textarea,.f input{width:100%; border:1px solid var(--linia); background:var(--karta);
   color:inherit; font:inherit; font-size:13.5px; border-radius:12px; padding:11px 12px;
   outline:none; resize:none}
.f select:focus,.f textarea:focus,.f input:focus{border-color:var(--akcent-moc)}
.przycisk{width:100%; border:0; background:var(--gradient); color:var(--on-akcent);
   font:inherit; font-weight:700; font-size:14.5px; padding:13px; border-radius:14px; cursor:pointer}
.przycisk-drugi{width:100%; border:1.5px solid var(--linia); background:var(--karta); color:var(--szary);
   font:inherit; font-weight:600; font-size:13px; padding:11px; border-radius:14px; cursor:pointer; margin-top:8px}
.fnote{font-size:10.5px; color:var(--szary); text-align:center; margin-top:8px; line-height:1.4}
/* A-04t: „pokaż stare daty" — trzeci poziom hierarchii rodziny (W-36):
   sam tekst w akcencie, bez ramki, bo to podgląd, nie akcja na maszynie. */
.fnote .przycisk-link{background:none; border:0; font-family:inherit; font-size:11px;
   font-weight:700; color:var(--akcent); padding:9px 12px; min-height:38px; cursor:pointer}

/* ---- A-17: Skrzynka — tryb „Porządkuj", powody, lista odrzuconych ----
   Wariant C z makiety (wybór Marka 03.09.2026): na co dzień lista wygląda jak
   dotąd, krzyżyki pojawiają się dopiero po włączeniu trybu. Powód: kciuk na
   telefonie trafia w wiersz łatwiej, niż by się chciało, a odrzucenie wpisu to
   jedyne miejsce, gdzie użytkownik SAM usuwa coś z widoku. */
.sk-h-linia{display:flex; align-items:center; justify-content:space-between; gap:10px}
.sk-h-linia .h{margin:14px 0 8px}
.sk-btn{display:inline-flex; align-items:center; justify-content:center; gap:6px;
   font:inherit; font-size:11.5px; font-weight:600; padding:0 13px; min-height:44px;
   border-radius:999px; cursor:pointer; flex:none; background:transparent;
   color:var(--szary); border:1px solid var(--linia)}
.sk-btn svg{width:14px; height:14px}
.sk-btn.aktywny{color:var(--akcent); border-color:var(--akcent)}
.sk-porzadkuj{min-height:36px; padding:0 12px}
.sk-ikonbtn{width:44px; height:44px; border-radius:12px; flex:none; display:flex;
   align-items:center; justify-content:center; background:transparent;
   border:1px solid var(--linia); color:var(--szary); cursor:pointer}
.sk-ikonbtn svg{width:16px; height:16px}
.sk-panel{border-top:1px solid var(--linia); padding:10px 2px 4px}
.sk-panel-t{font-size:12px; color:var(--szary); margin-bottom:8px}
.sk-chipy{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
.sk-chip{font:inherit; font-size:11.5px; font-weight:600; padding:0 14px; min-height:44px;
   display:inline-flex; align-items:center; border-radius:999px; cursor:pointer; border:0;
   background:var(--bg-akcentjasny); color:var(--tekst-akcentjasny)}
.sk-linia{display:flex; align-items:center; justify-content:space-between; width:100%;
   font:inherit; font-size:12px; font-weight:600; color:var(--szary); background:transparent;
   border:0; padding:9px 0; min-height:38px; cursor:pointer}
.sk-linia span{font-weight:700; color:var(--akcent)}
.sk-szary .t1, .sk-szary .t2{opacity:.62}
.sk-stopka{display:flex; justify-content:flex-end; padding-top:10px}

/* komunikaty (wzorzec rodziny) */
.komunikat{border-radius:12px; padding:12px 14px; margin:10px 0 2px; font-size:13px; display:none; line-height:1.45}
.komunikat.ok{display:block; background:var(--bg-ok); border:1px solid var(--ok); color:var(--ok)}
.komunikat.blad{display:block; background:var(--bg-blad); border:1px solid var(--blad); color:var(--blad)}
.komunikat.uwaga{display:block; background:var(--bg-uwaga); border:1px solid var(--uwaga); color:var(--uwaga)}

/* kolejka offline (E-40/D50 z rodziny) */
.kolejka-karta{border:1px solid var(--uwaga); background:var(--bg-uwaga); border-radius:12px;
   padding:10px 12px; margin:10px 0; font-size:12px; color:var(--uwaga)}
.kolejka-karta b{display:block; font-size:12.5px; margin-bottom:2px}
.kolejka-karta .k-akcje{margin-top:7px; display:flex; gap:7px}
.k-btn{border:1.5px solid var(--ok); background:var(--bg-ok); color:var(--ok); font:inherit;
   font-size:11px; font-weight:700; padding:5px 12px; border-radius:9px; cursor:pointer}
.k-btn.usun{border-color:var(--blad); background:var(--bg-blad); color:var(--blad)}

/* overlay zapisu (Z-87) */
.overlay-zapis{position:fixed; inset:0; background:rgba(15,17,21,.55); display:none;
   align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:50}
.overlay-zapis.on{display:flex}
.overlay-zapis .spinner{width:42px; height:42px; border-radius:50%; position:relative}
.overlay-zapis .spinner::before{content:''; position:absolute; inset:0; border-radius:50%;
   border:4px solid rgba(255,255,255,.25)}
.overlay-zapis .spinner::after{content:''; position:absolute; inset:0; border-radius:50%;
   border:4px solid transparent; border-top-color:#fff; animation:kreciSie .8s linear infinite}
.overlay-zapis .tekst{color:#fff; font-size:14px; font-weight:600}
@keyframes kreciSie{to{transform:rotate(360deg)}}

/* ustawienia */
.ust label{display:block}
/* ==== Ustawienia — układ 1:1 z Flotą/Ewidencją (W-31), tokeny Asystenta.
   Te same klasy co w rodzinie (.ust-tryb, .pal-poz, .ust-notka), żeby paczka
   wyglądu W-41 była przenośna. Prośba Marka 30.08: "chciałbym aby było takie
   same" — różnice tylko tam, gdzie Asystent nie ma tokenu rodziny
   (--bg-akcentjasny/--przycisk-cien → color-mix z fallbackiem). ==== */
.ust-sekcja{font-size:11.5px; font-weight:700; text-transform:uppercase;
   letter-spacing:.07em; color:var(--szary); margin:18px 2px 9px;
   display:flex; align-items:center; gap:7px}
.ust-sekcja:first-of-type{margin-top:2px}
.ust-sekcja svg{width:14px; height:14px; stroke:currentColor}
/* ---- ekran „Ustawienia" (tryb + palety): CSS WE WSPÓLNYM BLOKU KANONU ---- */

/* stopka wersji (W-22) */
.stopka-wersji{margin-top:16px; text-align:center; font-size:10px; color:var(--szary);
   opacity:.35; font-variant-numeric:tabular-nums; user-select:text}

/* logowanie */
#widokLogin{flex:1; display:flex; flex-direction:column; justify-content:center; padding:26px 22px 60px}
#widokLogin .logo{width:84px; height:84px; border-radius:22px; margin:0 auto 16px; display:block;
   box-shadow:0 8px 24px rgba(15,23,32,.25)}
#widokLogin h1{text-align:center; font-size:21px; margin:0 0 4px; letter-spacing:-.3px}
#widokLogin .pod{text-align:center; color:var(--szary); font-size:12.5px; margin:0 0 22px}
#widokLogin input{text-align:center; font-size:16px; letter-spacing:2px; text-transform:uppercase;
   font-family:ui-monospace,Consolas,monospace}

/* dolna nawigacja + wskaźnik Z-95 */
nav{display:flex; border-top:1px solid var(--linia); background:var(--karta);
   padding:4px 4px calc(8px + env(safe-area-inset-bottom)); position:sticky; bottom:0; z-index:5}
nav button{flex:1; border:0; background:none; color:var(--szary); font:inherit; font-size:9.5px;
   display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 4px;
   cursor:pointer; border-radius:12px; transition:color .2s}
nav button svg{width:21px;height:21px;stroke:currentColor; transition:transform .2s}
nav button.on{color:var(--akcent); font-weight:700}
nav button.on svg{transform:translateY(-1px)}
nav button.zg .plus{width:100%;height:100%;border-radius:50%;background:var(--grad-maly,var(--gradient));
   display:flex;align-items:center;justify-content:center; transition:transform .2s}
nav button.zg.on .plus-glow{transform:scale(1.07)}
nav button.zg .plus svg{stroke:#fff;width:20px;height:20px; stroke-width:2.2}
/* ⚠ Kreska musi liczyć się w TYM SAMYM pudełku co przyciski. Nawigacja ma
   po 4 px paddingu z boków, więc przyciski zaczynają się od 4 px i mają po
   (100% − 8px)/5 szerokości. Wcześniej wskaźnik szedł od krawędzi ekranu
   i po 20% szerokości — przez to na skrajnych zakładkach uciekał o ~3 px
   w przeciwne strony, a na środkowej trafiał idealnie (usterka zgłoszona
   przez Marka 28.08). --zakladki podmienia JS, gdy rola nie widzi Kosztów. */
nav{--zakladki:5}
nav .wskaznik{position:absolute; top:0; left:4px; height:3px;
   width:calc((100% - 8px) / var(--zakladki));
   display:flex; justify-content:center; pointer-events:none;
   transition:transform .34s cubic-bezier(.4,1.3,.5,1), opacity .18s linear}
nav .wskaznik i{width:44%; height:100%; border-radius:0 0 2px 2px;
   background:var(--wskaznik-grad); background-size:300% 100%;
   animation:plyn 6s linear infinite}
nav .wskaznik.bez-zakladki{opacity:0}
/* @keyframes plyn — definicja WE WSPÓLNYM BLOKU KANONU (nazwy klatek są globalne) */

.scr{display:none} .scr.on{display:block; animation:wejscieEkranu .22s ease-out}
@keyframes wejscieEkranu{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.ukryte{display:none !important}

@media (prefers-reduced-motion: reduce){
  .scr.on{animation:none}
  nav .wskaznik{transition:opacity .18s linear}
  nav .wskaznik i{animation:none}
  .overlay-zapis .spinner::after{animation-duration:1.6s}
  /* paski wykresu: bez jazdy, ale MUSZĄ zostać wypełnione (animation-fill
     nie zadziała, gdy animacji nie ma — dlatego jawna szerokość) */
  .kfl{animation:none; width:var(--do)}
  .przycisk-glow, .przycisk-glow::after,
  nav button.zg .plus-glow, nav button.zg .plus-glow::after,
  [data-paleta="aurora"] header,[data-paleta="gamma"] header,
  [data-paleta="heros"] header,[data-paleta="rgb"] header,
  [data-paleta="rgb"] header::after,
  [data-paleta="aurora"] .przycisk,[data-paleta="aurora"] .hero,
  [data-paleta="gamma"] .przycisk,[data-paleta="gamma"] .hero,
  [data-paleta="heros"] .przycisk,[data-paleta="heros"] .hero,
  [data-paleta="rgb"] .przycisk,[data-paleta="rgb"] .hero,
  .pal-poz.spec .probka{animation:none}
}
</style>

<script>
/* ========================================================================== */
/* ASYSTENT FLOTY — logika. Zasada #1: statusów NIE ustawia się w aplikacji.  */
/* ========================================================================== */
'use strict';

/* ---------- ikony SVG — IDENTYCZNE jak w Aplikacji Flota / Ewidencji ----------
   Ścieżki przepisane 1:1 z <symbol id="ic-..."> tamtych aplikacji, razem z ich
   parametrami kreski (.ikona: fill:none, stroke-width 1.75, zaokrąglone końce).
   Nie rysujemy własnych glifów — rodzina ma wyglądać jak jedna rodzina.
   Wyjątki (w rodzinie nie ma takiego symbolu, dorysowane w tym samym stylu):
   `lupa` i `gear`. */
function svg_(sciezki, styl){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" '+
         'stroke-linecap="round" stroke-linejoin="round"'+(styl?' style="'+styl+'"':'')+'>'+
         sciezki+'</svg>';
}
var I = {
  /* PULS — nowa (rodzina ma tylko ic-gauge, czyli licznik). Linia EKG
     w tej samej kresce co reszta zestawu (1.75, zaokrąglone końce). */
                   puls:  svg_('<path d="M3.2 12h3.3l2-5.6 3.4 11.2 2.4-7 1.6 3.4h4.9"/>'),
  /* nowa, styl rodziny */ lupa: svg_('<circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4 4"/>'),
  /* ic-plus */    plus:  svg_('<path d="M12 5v14M5 12h14"/>'),
  /* A-17: krzyżyk (odrzuć wpis) — ta sama kreska co reszta zestawu */
                   krzyzyk: svg_('<path d="m7 7 10 10M17 7 7 17"/>'),
  /* ic-clip */    sprawy:svg_('<path d="M9 4.5h6M9 4.5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 4.5M9 4.5H7a1.5 1.5 0 0 0-1.5 1.5v13A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V6A1.5 1.5 0 0 0 17 4.5h-2M9 4.5v2h6v-2M9 11h6M9 15h4"/>'),
  /* ic-chart */   koszty:svg_('<path d="M4 4.5v14a1.5 1.5 0 0 0 1.5 1.5H20M8.5 16v-4M12.5 16V8.5M16.5 16v-6"/>'),
  /* ic-site */    budowa:svg_('<path d="M4 20.5h16M7 20.5V9l10-4.5v16M10.5 9.5v2.5M13.5 8.5v3.5M10.5 15v2.5M13.5 14.5V18"/>'),
  /* ic-wrench */  wr:    svg_('<path d="M14.5 6.5a4 4 0 0 1 5.4-4.1L17 5.3l1.7 1.7 2.9-2.9a4 4 0 0 1-5.1 5.4l-8 8a2 2 0 0 1-2.9-2.9l8-8.1Z"/>'),
  /* ic-warn */    uwaga: svg_('<path d="M12 4 3.5 19h17L12 4ZM12 10v4M12 16.8v.2"/>'),
  /* ic-clock */   zegar: svg_('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  /* ic-user */    osoba: svg_('<circle cx="12" cy="8.5" r="3.7"/><path d="M5 20a7.3 7.3 0 0 1 14 0"/>'),
  /* ic-money */   kasa:  svg_('<rect x="3" y="7" width="18" height="11" rx="2"/><circle cx="12" cy="12.5" r="2.6"/><path d="M6 10.2v0M18 15v0"/>'),
                   back:  svg_('<path d="M15 18l-6-6 6-6"/>', 'width:13px;height:13px'),
  /* nowa, styl rodziny — pełna zębatka (sam okrąg z kreskami czytał się
     jak słońce, czyli jak ic-sun z rodziny) */
  /* W-41: ikony ekranu Ustawień — ścieżki 1:1 ze sprite'u rodziny
     (ic-sun / ic-moon / ic-phone / ic-lock / ic-check; osoba dorysowana
     w tym samym stylu, bo rodzina nie ma ic-user). */
  slonce:  svg_('<circle cx="12" cy="12" r="4"/><path d="M12 3v1.8M12 19.2V21M21 12h-1.8M4.8 12H3M18.4 5.6l-1.3 1.3M6.9 17.1l-1.3 1.3M18.4 18.4l-1.3-1.3M6.9 6.9 5.6 5.6"/>'),
  ksiezyc: svg_('<path d="M19.5 14.5A7.8 7.8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"/>'),
  telefon: svg_('<rect x="6.5" y="2.5" width="11" height="19" rx="2.2"/><path d="M10.5 5.2h3M10.8 18.6h2.4"/>'),
  klodka:  svg_('<rect x="5.5" y="10.5" width="13" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5M12 14.5v2"/>'),
  osoba:   svg_('<circle cx="12" cy="8.2" r="3.4"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"/>'),
  check:   svg_('<circle cx="12" cy="12" r="8.5"/><path d="m8.3 12.3 2.5 2.6 4.9-5.4"/>'),
  odswiez: svg_('<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>'),
  gear: svg_('<circle cx="12" cy="12" r="3.1"/><path d="M19.1 13.6a7.6 7.6 0 0 0 0-3.2l1.8-1.4-1.8-3.1-2.1.8a7.6 7.6 0 0 0-2.7-1.6L14 2.8h-4l-.3 2.3a7.6 7.6 0 0 0-2.7 1.6l-2.1-.8-1.8 3.1 1.8 1.4a7.6 7.6 0 0 0 0 3.2l-1.8 1.4 1.8 3.1 2.1-.8a7.6 7.6 0 0 0 2.7 1.6l.3 2.3h4l.3-2.3a7.6 7.6 0 0 0 2.7-1.6l2.1.8 1.8-3.1-1.8-1.4Z"/>')
};
/* ---------- RODZAJ POJAZDU: kod, kolor i ikona ----------
   Kolory i KOLEJNOŚĆ dopasowania przepisane 1:1 z rodzajColor() w Panelu
   Floty (paleta v93) — ta sama, którą Marek widzi w formatowaniu warunkowym
   Spisu i na naklejkach QR. Pierwsza pasująca reguła wygrywa, jak w Excelu. */
function kodRodzaju(rodzaj){
  var r = String(rodzaj || '').trim().toLowerCase();
  if (r === 'sprzęt budowlany') return 'bud';
  if (r.indexOf('przyczepa') !== -1 || r.indexOf('naczepa') !== -1) return 'przycz';
  if (r.indexOf('kopark') !== -1 || r.indexOf('ładowarka') !== -1) return 'kop';
  if (r.indexOf('hds') !== -1 || r.indexOf('dźwig') !== -1) return 'hds';
  if (r.indexOf('sam. ciężarowy') !== -1 || r.indexOf('ciężarow') !== -1 ||
      r.indexOf('dostaw') !== -1) return 'ciez';
  if (r.indexOf('sam. osobowy') !== -1 || r.indexOf('osobow') !== -1) return 'osob';
  /* Quad / Maverick / ciągnik — w Spisie nie mają reguły, więc w Panelu biorą
     szary fallback (#636E72). Ikonę dorysowaliśmy (prośba Marka 28.08). */
  if (r.indexOf('quad') !== -1 || r.indexOf('ciągnik') !== -1) return 'quad';
  return 'inne';
}
/* ---------- IKONY POJAZDÓW — osobny zestaw rodziny ----------
   ⚠ To NIE są ikony ze sprite'u <symbol> (te mają kreskę 1.75). Pojazdy mają
   własny zestaw, identyczny w `IKONY` w Aplikacji Ewidencji i w `rodzajIcon()`
   w Panelu Floty (v51) — kreska 2. Przepisane 1:1, razem z fallbackiem.
   Jedyny dodatek: `quad` (Maverick) — rodzina go nie ma, w Panelu wpada
   w fallback; ikona narysowana na prośbę Marka 28.08.2026. */
var IKONY_POJ = {
  auto:      '<path d="M5 13l1.5-4.5A2 2 0 018.4 7h7.2a2 2 0 011.9 1.5L19 13"/><path d="M4 13h16a1 1 0 011 1v3h-2"/><path d="M5 17H3v-3a1 1 0 011-1"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/><path d="M9.5 17h5"/>',
  bus:       '<path d="M3 13l2-6h11l3 6"/><path d="M3 13h18v5h-2"/><path d="M7 18H5v-5"/><circle cx="8" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M10 18h5"/>',
  koparka:   '<path d="M3 18h10"/><circle cx="5" cy="18" r="1.6"/><circle cx="11" cy="18" r="1.6"/><path d="M4 15h8v-4H6l-2 4z"/><path d="M12 12l4-6 4 2-3 5"/><path d="M20 8l1 4-3 1"/>',
  hds:       '<path d="M3 13l2-6h6l2 6"/><path d="M3 13h18v5h-2"/><path d="M7 18H5v-5"/><circle cx="8" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M13 7l6-3"/><path d="M19 4v5"/><path d="M19 9l-1.5 1.5"/>',
  przyczepa: '<rect x="2" y="8" width="15" height="7" rx="1"/><path d="M17 12h5"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="12" cy="17.5" r="1.8"/>',
  quad:      '<circle cx="6" cy="16.4" r="2.6"/><circle cx="18" cy="16.4" r="2.6"/><path d="M6 13.8h3.4l1.9-3.4h4.3l1.5 3.4h.9"/><path d="M11.3 10.4 10 7.6h4"/>',
  inne:      '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>'
};
/* Z-9b (30.08.2026, uwaga Marka): pole wybieraka miało ikonę kategorii
   „inne" (kółko z promieniami — wyglądała jak słońce). Pole dostaje własne:
   lupę przy „Wybierz maszynę…" (bo otwiera wyszukiwarkę) i pytajnik przy
   „Nie wiem / inna". Ikony kategorii na listach — bez zmian. */
function ikonaLupa_(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '+
         'stroke-linecap="round" stroke-linejoin="round">'+
         '<circle cx="11" cy="11" r="6.5"/><path d="m15.8 15.8 4.4 4.4"/></svg>';
}
function ikonaPytajnik_(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '+
         'stroke-linecap="round" stroke-linejoin="round">'+
         '<circle cx="12" cy="12" r="8.5"/>'+
         '<path d="M9.5 9.2a2.6 2.6 0 0 1 5.1.8c0 1.7-2.6 2.1-2.6 3.5M12 16.9h.01"/></svg>';
}
function ikonaRodzaju(kod){
  var k = kod==='kop' ? 'koparka' : kod==='ciez' ? 'bus' : kod==='osob' ? 'auto'
        : kod==='przycz' ? 'przyczepa' : kod==='hds' ? 'hds'
        : kod==='quad' ? 'quad' : 'inne';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '+
         'stroke-linecap="round" stroke-linejoin="round">'+IKONY_POJ[k]+'</svg>';
}

/* ---------- KOLEJNOŚĆ LIST — jak w rodzinie (rangaTypu_ z Floty/Ewidencji):
   auta osobowe → dostawcze/ciężarowe → koparki/ładowarki → HDS → przyczepy.
   W obrębie kategorii alfabetycznie po TYM, czym Marek posługuje się na co
   dzień: maszyny po swojej nazwie, auta po rejestracji — a to jedno i to samo
   pole (klucz ze Słownika), więc wystarczy jedno porównanie. */
function rangaTypu_(typ){
  var t = String(typ || '').toLowerCase();
  /* ⚠ PRZYCZEPY SPRAWDZAMY PIERWSZE. W Spisie jest rodzaj „przyczepa
     ciężarowa" — przy kolejności z Floty wpadał między auta dostawcze,
     bo pasował do „ciężarow". Tu typy są opisowe, więc kolejność testów
     musi iść od najbardziej szczegółowych. */
  if (t.indexOf('przyczep') !== -1 || t.indexOf('naczep') !== -1) return 4;
  if (t.indexOf('hds') !== -1 || t.indexOf('dźwig') !== -1) return 3;
  if (t.indexOf('kopark') !== -1 || t.indexOf('ładowarka') !== -1) return 2;
  if (t.indexOf('osobow') !== -1) return 0;
  if (t.indexOf('dostaw') !== -1 || t.indexOf('bus') !== -1 || t.indexOf('ciężarow') !== -1) return 1;
  return 5;
}
/* Etykieta maszyny: PIERWSZE jest to, po czym Marek ją zna (rejestracja lub
   własna nazwa maszyny), model idzie jako dopisek — dokładnie jak w rodzinie
   ("WP 6865P — Opel Movano"). */
var NAZWY_KATEGORII = ['Samochody osobowe','Dostawcze i ciężarowe','Koparki i ładowarki',
                       'HDS i dźwigi','Przyczepy','Pozostałe'];
function nazwaKategorii_(m){ return NAZWY_KATEGORII[rangaTypu_(m.rodzaj)] || 'Pozostałe'; }
function kluczMaszyny(m){ return m.rejestracja || m.nazwa || ''; }
function modelMaszyny(m){
  var k = kluczMaszyny(m);
  return (m.nazwa && m.nazwa !== k) ? m.nazwa : '';
}
/* Koparka / koparko-ładowarka / koparka gąsienicowa — TYLKO te. „ładowarka"

/* ---------- daty i liczby ---------- */
function dzis(){ var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function dataZ(iso){ if(!iso) return null; var m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function dniDo(iso){ var d=dataZ(iso); if(!d) return null;
  return Math.round((d - dzis()) / 86400000); }
function dataPL(iso){ var d=dataZ(iso); if(!d) return '—';
  return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear(); }
function czasPL(iso){ if(!iso) return '—'; var s=String(iso);
  return dataPL(s) + (s.length>10 ? ', '+s.slice(11,16) : ''); }
function zl(n){ if(typeof n!=='number') return '—';
  return n.toLocaleString('pl-PL',{minimumFractionDigits:2, maximumFractionDigits:2})+' zł'; }
var MIESIACE = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec',

  return '<span class="pill '+kl+'">'+esc(s)+'</span>';
}
/* ZAMKNIĘTE = nic już nie trzeba zrobić. „Wykonane" NIE jest zamknięte:
   wg cyklu życia z notatki projektu znaczy „zrobione, czekamy na fakturę". */
function czyWToku(s){ return s!=='Rozliczone' && s!=='Anulowane'; }
/* Z-11: „w robocie" = sprawa, przy której ktoś jeszcze coś robi.
   „Do rozliczenia" = Wykonane bez wpisanej faktury. */

/* Z-11: dni ROBOCZE od podanej daty do dziś (dzień wpisu się nie liczy).
   Weekend nie liczy się do progów — w sobotę serwis i tak nie odpisze. */
function dniRobocze_(od){
  var d = dataZ(od); if (!d) return null;
  var b = dzis(), n = 0;
  d = new Date(d.getTime()); d.setDate(d.getDate() + 1);
  while (d <= b){
    var dz = d.getDay();
    if (dz !== 0 && dz !== 6) n++;
    d.setDate(d.getDate() + 1);
  }
  return n;
}
/* Z-11: dni kalendarzowe od daty do dziś. */
function dniOd_(od){ var d = dniDo(od); return d === null ? null : -d; }
/* Progi przypomnień — jedno miejsce do strojenia (cykl życia z notatki
   projektu). Nowe/Wycena w dniach ROBOCZYCH, reszta w kalendarzowych. */
var PROGI = { nowe: 2, wycena: 3, realizacja: 7, faktura: 7 };
/* A-04t (31.08.2026): terminy flotowe. `wyprzedzenie` — ile dni przed
   wygaśnięciem zaczynamy przypominać (Marek: 14). `stare` — powyżej ilu dni
   PO terminie przestajemy traktować datę jak alarm i uznajemy ją za brud
   w danych (na 31.08: cztery auta z 2019/2025 r.). */
var PROGI_TERMINY = { wyprzedzenie: 14, stare: 60 };
var ETYKIETY_TERMINOW = { badanie:'badanie techniczne', oc:'polisa OC',
                          udt:'przegląd UDT', mienie:'ubezpieczenie mienia' };
/* Zwraca { pilne: [...], stare: [...] } — pozycja to { m, rodzaj, iso, dni }.
   `dni` < 0 = po terminie. Sortowane chronologicznie: najstarsze wygaśnięcie
   na górze, potem to, co dopiero nadchodzi. */
function terminyFlotowe_(){
  var pilne = [], stare = [];
  (dane && dane.maszyny || []).forEach(function(m){
    var ter = m.terminy || {};
    for (var k in ETYKIETY_TERMINOW){
      if (!ter[k]) continue;
      var d = dniDo(ter[k]);
      if (d === null) continue;
      var poz = { m: m, rodzaj: k, iso: ter[k], dni: d };
      if (d < -PROGI_TERMINY.stare) stare.push(poz);
      else if (d <= PROGI_TERMINY.wyprzedzenie) pilne.push(poz);
    }
  });
  var chrono = function(a, b){ return a.dni - b.dni; };
  return { pilne: pilne.sort(chrono), stare: stare.sort(chrono) };
}
function kafelTerminu_(p){
  var m = p.m, po = p.dni < 0;
  var ile = Math.abs(p.dni);
  var pill = po ? '<span class="pill red">wygasło ' + ile + ' dn.</span>'
           : p.dni === 0 ? '<span class="pill red">wygasa DZIŚ</span>'
           : '<span class="pill amber">za ' + ile + ' dn.</span>';
  var podpis = podpisMaszyny(m), vin = czyKoparka_(m) && podpis === m.vin;
  return '<div class="row" onclick="otworzMaszyne(\'' + m.id + '\')">' +
    '<div class="ic k-' + kodRodzaju(m.rodzaj) + '">' + ikonaRodzaju(kodRodzaju(m.rodzaj)) + '</div>' +
    '<div class="mid"><div class="g1"><span class="s-klucz">' + esc(kluczMaszyny(m)) + '</span>' + pill + '</div>' +
    (podpis ? '<div class="s-podpis' + (vin ? ' vin' : '') + '">' + esc(podpis) + '</div>' : '') +
    '<div class="s-opis">' + ETYKIETY_TERMINOW[p.rodzaj] + '</div>' +
    '<div class="g3"><span class="s-nr">' + esc(m.id) + '</span>' +
    '<span class="s-ter' + (po ? ' red' : '') + '">ważne do: ' + dataPL(p.iso) + '</span></div></div></div>';
}

  if (trwaPobieranie) return Promise.resolve();

      if (!cicho) stanSync('blad', d.blad || 'błąd serwera');
      return 'blad';
    }
    dane = d; dane._pobrano = Date.now();
    lsSet(K.dane, JSON.stringify(d));
    /* v9: flaga palet specjalnych z serwera (API v3). Zapamiętana, żeby
       bramka działała też offline; wczytajWyglad() cicho cofa na domyślną,

    lsSet(K.spec, d.osoba && d.osoba.paletySpecjalne ? 'TAK' : 'NIE');
    wczytajWyglad();

   tego po czym poznać. Teraz przycisk sam mówi, co robi. */
var napisOdswiez = 'odśwież';
/* ⚠ Stan MUSI siedzieć w zmiennej, nie tylko w klasie na elemencie: udane
   pobranie woła rysujWszystko(), które buduje pasek od nowa — dopisana ręcznie
   klasa `kreci` znikała razem ze starym przyciskiem (złapane testem). */
var trwaOdswiezanie = false;

  trwaOdswiezanie = true;
  var b = el('btnOdsw'), t = el('btnOdswTxt');

  var start = Date.now();

    /* minimum 400 ms, żeby przy szybkiej sieci mrugnięcie było widoczne */
    setTimeout(function(){
      trwaOdswiezanie = false;
      napisOdswiez = stan === 'ok' ? 'aktualne' : 'odśwież';
      var b2 = el('btnOdsw'), t2 = el('btnOdswTxt');

    skrz.forEach(function(w){

        ? '<button class="sk-ikonbtn" title="Odrzuć wpis" onclick="pytajOPowod(\''+esc(w.s_id)+'\')">'+I.krzyzyk+'</button>'
        : '<span class="pill amber">czeka</span>';
      h += wierszSkrzynki_(w, prawa);
      if (porzadkujSkrzynke && odrzucanySId === w.s_id){
        h += '<div class="sk-panel"><div class="sk-panel-t">Odrzucić ten wpis? Dlaczego:</div><div class="sk-chipy">';
        POWODY.forEach(function(pw){
          h += '<button class="sk-chip" onclick="odrzucWpis(\''+esc(w.s_id)+'\',\''+pw+'\')">'+pw+'</button>';
        });
        h += '</div><button class="sk-btn" onclick="anulujOdrzucenie()">Anuluj</button></div>';
      }
    });
    h += '</div>';
  }
  if (odrz.length){
    h += '<div class="karta"><button class="sk-linia" onclick="przelaczOdrzucone()">'+
         odrz.length+' '+odmianaOdrzuconych_(odrz.length)+
         '<span>'+(odrzuconeOtwarte?'ukryj':'pokaż')+'</span></button>';
    if (odrzuconeOtwarte){
      odrz.forEach(function(w){
        var wroc = '<button class="sk-btn" onclick="cofnijOdrzucenie(\''+esc(w.s_id)+'\')">'+
                   I.odswiez+'Wróć do kolejki</button>';
        var kopia = { rodzaj:w.rodzaj, dotyczy:w.dotyczy, maszyna:w.maszyna,
                      kto:'odrzucone '+(w.odrzucono||'—'), utworzono:(w.powod||''), tresc:w.tresc };
        h += wierszSkrzynki_(kopia, wroc, ' sk-szary');
      });
      h += '<div class="sk-stopka"><button class="sk-btn" onclick="wyczyscOdrzucone()">Wyczyść odrzucone</button></div>'+
           '<div class="fnote">Odrzucone starsze niż 30 dni chowają się same raz w miesiącu. '+
           'Wiersze zostają w arkuszu — znikają tylko z aplikacji.</div>';
    }
    h += '</div>';
  }
  if (skrzKom) h += '<div class="fnote">'+esc(skrzKom)+'</div>';
  return h;
}
function odmianaOdrzuconych_(n){
  if (n === 1) return 'odrzucony wpis';
  var d = n % 10, st = n % 100;
  return (d >= 2 && d <= 4 && !(st >= 12 && st <= 14)) ? 'odrzucone' : 'odrzuconych';
}

/* ---------- PULS ---------- */
function rysujPuls(){
  if (!dane) return;
  var sp = dane.sprawy || [], skrz = skrzynkaCzekajaca_();
  var wToku = sp.filter(function(s){ return czyWToku(s.status); });
  var poTerminie = wToku.filter(function(s){ var d = dniDo(s.termin); return d !== null && d < 0; });
  var terminDzis = wToku.filter(function(s){ return dniDo(s.termin) === 0; });
  var wSerwisie = wToku.filter(function(s){ return s.status === 'W realizacji'; });

  /* ===== Z-11: STRAŻNIK (A-04) — komplet reguł z cyklu życia w notatce
     projektu. Kolejność dopisywania = priorytet: pierwsza pasująca reguła
     wygrywa (niżej odsiewa `widziane`). Progi w PROGI, liczone w aplikacji
     — arkusz nietknięty (Zasada #1: status wynika z treści, nie z klikania). */
  var uwaga = [];
  /* 1. termin minął — najważniejsze, bo ktoś czeka */
  poTerminie.forEach(function(s){ uwaga.push([s, '<span class="pill red">po terminie '+(-dniDo(s.termin))+' dn.</span>']); });
  /* 2. termin dziś */
  terminDzis.forEach(function(s){ uwaga.push([s, '<span class="pill amber">termin DZIŚ</span>']); });
  /* 3. Wykonane bez faktury — robota skończona, pieniądze nierozliczone */
  sp.forEach(function(s){
    if (s.status !== 'Wykonane' || s.nr_faktury) return;
    var d = dniOd_(s.status_od);
    if (d !== null && d > PROGI.faktura)
      uwaga.push([s, '<span class="pill red">bez faktury '+d+' dn.</span>']);
  });
  /* 4. wisi w realizacji */
  wToku.forEach(function(s){
    if (s.status !== 'W realizacji') return;
    var d = dniOd_(s.status_od);
    if (d !== null && d > PROGI.realizacja)
      uwaga.push([s, '<span class="pill amber">w serwisie '+d+' dn.</span>']);
  });
  /* 5. brak wyceny */
  wToku.forEach(function(s){
    if (s.status !== 'Wycena') return;
    var d = dniRobocze_(s.status_od);
    if (d !== null && d > PROGI.wycena)
      uwaga.push([s, '<span class="pill acc">brak wyceny '+d+' dn. rob.</span>']);
  });
  /* 6. Umówione bez terminu — luka w danych: status mówi „termin ustalony",
     a pola Termin nie ma, więc nic tej sprawy nie przypilnuje */
  wToku.forEach(function(s){
    if (s.status === 'Umówione' && !s.termin)
      uwaga.push([s, '<span class="pill amber">brak terminu</span>']);
  });
  /* 7. Nowe leży bez ruchu */
  wToku.forEach(function(s){
    if (s.status !== 'Nowe') return;
    var d = dniRobocze_(s.status_od || s.utworzono);
    if (d !== null && d > PROGI.nowe)
      uwaga.push([s, '<span class="pill acc">nowe od '+d+' dn. rob.</span>']);
  });
  var widziane = {};
  uwaga = uwaga.filter(function(p){ if(widziane[p[0].id]) return false; widziane[p[0].id]=true; return true; });
  var doRozliczenia = sp.filter(czyDoRozliczenia);

  var h = '';
  /* pasek "dane z" */
  var meta = dane.meta || {};
  var klasa = stanSieci.tryb==='ok' ? '' : ' '+stanSieci.tryb;
  var opis = stanSieci.tryb==='offline' ? 'offline — pokazuję ostatnie pobrane dane'
           : stanSieci.tryb==='blad' ? 'błąd: '+esc(stanSieci.info||'')
           : 'dane z: <b>'+esc(meta.aktualizacja||'—')+'</b>';
  h += '<div class="pasek-sync'+klasa+'"><span class="kropka"></span>'+opis+
       '<button class="odsw'+(trwaOdswiezanie?' kreci':'')+'" id="btnOdsw" onclick="odswiezRecznie()">'+I.odswiez+
       '<span id="btnOdswTxt">'+esc(napisOdswiez)+'</span></button></div>';

  h += kolejkaHTML();

  h += skrzynkaHTML(skrz);

  h += '<div class="h">Dziś wymaga uwagi</div>';
  if (!uwaga.length) {
    /* Z-11: pusto ZNACZY „żadna sprawa nie przekroczyła progu" — dopisujemy
       ile ich w ogóle jest, żeby pustka nie wyglądała jak awaria. */
    h += '<div class="karta"><div class="pusto">Nic nie pali się dzisiaj — wszystko pod kontrolą.</div>'+
      (wToku.length ? '<div class="fnote">'+wToku.length+' '+
        (wToku.length===1?'sprawa w toku, żadna':'w toku, żadna')+
        ' nie przekroczyła progu przypomnienia</div>' : '')+'</div>';
  } else {
    h += '<div class="karta">';
    /* Z-10b: ten sam kafelek co na liście spraw. Plakietka = POWÓD uwagi
       (p[1]), status ląduje na dole obok numeru. */
    uwaga.slice(0,6).forEach(function(p){
      h += kafelSprawy_(p[0], { pill: p[1], status: true });
    });
    if (uwaga.length > 6)
      h += '<div class="fnote">…i jeszcze '+(uwaga.length-6)+' — cała lista w zakładce Sprawy</div>';
    h += '</div>';
  }

  /* A-04t: OSOBNA sekcja (wariant C) — terminy to nie to samo co sprawy
     u mechanika. Wewnątrz wariant B: stare daty schowane pod jedną linijkę. */
  var tf = terminyFlotowe_();
  if (tf.pilne.length || tf.stare.length){
    h += '<div class="h">Terminy floty — najbliższe '+PROGI_TERMINY.wyprzedzenie+' dni</div><div class="karta">';
    if (!tf.pilne.length)
      h += '<div class="pusto">Żaden termin nie wygasa w najbliższych '+
           PROGI_TERMINY.wyprzedzenie+' dniach.</div>';
    tf.pilne.slice(0, 8).forEach(function(p){ h += kafelTerminu_(p); });
    if (tf.pilne.length > 8)
      h += '<div class="fnote">…i jeszcze '+(tf.pilne.length-8)+' — reszta w kartach maszyn</div>';
    if (tf.stare.length){
      /* Wariant B: to NIE jest alarm na dziś, tylko brud w Spisie —
         nie krzyczy czerwienią, ale też nie znika z oczu. */
      if (stareTerminyOtwarte) tf.stare.forEach(function(p){ h += kafelTerminu_(p); });
      h += '<div class="fnote"><button class="przycisk-link" onclick="event.stopPropagation();przelaczStareTerminy()">'+
        (stareTerminyOtwarte ? 'Zwiń stare daty' :
          tf.stare.length+' '+(tf.stare.length===1?'data starsza':'dat starszych')+
          ' niż '+PROGI_TERMINY.stare+' dni — pokaż')+'</button>'+
        '<div style="margin-top:4px">Prawdopodobnie stare wpisy w Spisie Floty, nie auta na chodzie — do przejrzenia.</div></div>';
    }
    h += '</div>';
  }

  h += '<div class="h">Flota w liczbach</div><div class="stats">'+
    '<div class="stat"><div class="n">'+wToku.length+'</div><div class="l">sprawy w toku</div></div>'+
    '<div class="stat"><div class="n'+(terminDzis.length?' uw':'')+'">'+terminDzis.length+'</div><div class="l">termin dziś</div></div>'+
    '<div class="stat"><div class="n">'+wSerwisie.length+'</div><div class="l">w serwisie</div></div>'+
    '<div class="stat"><div class="n'+(poTerminie.length?' zl':'')+'">'+poTerminie.length+'</div><div class="l">po terminie</div></div></div>';

  h += '<div class="stopka-wersji" id="stopkaWersji"></div>';
  el('ekranPuls').innerHTML = h;
  pokazWersje();
}
function maszynaSprawy(s){
  if (!dane || !s.id_pojazdu) return null;
  return (dane.maszyny||[]).find(function(m){ return m.id === s.id_pojazdu; }) || null;
}

/* ---------- SZUKAJ + KARTA MASZYNY ---------- */
var filtrKat = 'wszystkie', filtrTekst = '';
function rysujSzukaj(){
  if (!dane) return;
  var h = '<div class="szukajka">'+I.lupa+
    '<input id="szukInput" placeholder="Szukaj maszyny… (np. JCB, WP 6865P)" value="'+esc(filtrTekst)+'"></div>';
  /* chipy = kategorie z palety v93; pokazujemy tylko te, które realnie są */
  var katy = [['wszystkie','Wszystkie'],['osob','Osobowe'],['ciez','Ciężarowe'],
              ['kop','Koparki'],['hds','HDS'],['przycz','Przyczepy'],
              ['bud','Sprzęt'],['quad','Quady'],['inne','Inne']];
  var obecne = {}; (dane.maszyny||[]).forEach(function(m){ obecne[kodRodzaju(m.rodzaj)] = true; });
  katy = katy.filter(function(k){ return k[0]==='wszystkie' || obecne[k[0]]; });
  h += '<div class="chips">'+katy.map(function(k){
    return '<button class="chip'+(filtrKat===k[0]?' on':'')+'" onclick="ustawKat(\''+k[0]+'\')">'+k[1]+'</button>';
  }).join('')+'</div>';
  var lista = sortujMaszyny((dane.maszyny||[]).filter(function(m){
    if (filtrKat!=='wszystkie' && kodRodzaju(m.rodzaj)!==filtrKat) return false;
    if (!filtrTekst) return true;
    var t = filtrTekst.toLowerCase();
    return (m.nazwa||'').toLowerCase().indexOf(t)>=0 ||
           (m.rejestracja||'').toLowerCase().indexOf(t)>=0 ||
           (m.kierowca||'').toLowerCase().indexOf(t)>=0 ||
           /* VIN też przeszukujemy — wystarczy końcówka z tabliczki */
           (m.vin||'').toLowerCase().indexOf(t)>=0;
  }));
  h += '<div class="karta">';
  if (!lista.length) h += '<div class="pusto">Nic nie pasuje do szukania.</div>';
  var ostatniaRanga = null;
  lista.forEach(function(m){
    /* nagłówki kategorii — jak optgroup w listach rodziny */
    var r = rangaTypu_(m.rodzaj);
    if (!filtrTekst && r !== ostatniaRanga){
      ostatniaRanga = r;
      h += '<div class="grupa">'+esc(nazwaKategorii_(m))+'</div>';
    }
    var model = podpisMaszyny(m), vin = (model && model === m.vin);
    h += '<div class="mrow" onclick="otworzMaszyne(\''+m.id+'\')">'+
      '<span class="ik ic k-'+kodRodzaju(m.rodzaj)+'">'+ikonaRodzaju(kodRodzaju(m.rodzaj))+'</span>'+
      '<span class="nm"><b>'+esc(kluczMaszyny(m))+'</b>'+
        (model ? '<span class="model'+(vin?' vin':'')+'">'+esc(model)+'</span>' : '')+'</span>'+
      '<span class="chev">›</span></div>';
  });
  h += '</div>';
  el('ekranSzukaj').innerHTML = h;
  var inp = el('szukInput');
  inp.oninput = function(){ filtrTekst = inp.value;
    rysujSzukaj(); var i2 = el('szukInput'); i2.focus(); i2.setSelectionRange(i2.value.length, i2.value.length); };
}
function ustawKat(k){ filtrKat = k; rysujSzukaj(); }

function terminHTML(nazwa, iso){
  if (!iso) return '<div class="term"><div class="k">'+nazwa+'</div><div class="v nd">N.D.</div></div>';
  var d = dniDo(iso), kl = 'ok', dop = '';
  if (d !== null){
    if (d < 0){ kl = 'zl'; dop = -d + ' dn. temu'; }
    else if (d <= 30){ kl = 'uw'; dop = 'za ' + d + ' dn.'; }
    else dop = 'za ' + d + ' dn.';
  }
  return '<div class="term"><div class="k">'+nazwa+'</div><div class="v '+kl+'">'+dataPL(iso)+
         '</div><div class="dni">'+dop+'</div></div>';
}
function otworzMaszyne(id){
  biezacaMaszyna = id; rysujKartaMaszyny(); pokaz('karta');
}
function rysujKartaMaszyny(){
  var m = (dane.maszyny||[]).find(function(x){ return x.id === biezacaMaszyna; });
  if (!m){ el('ekranKarta').innerHTML = ''; return; }
  var h = '<div class="hero"><span class="back" onclick="pokaz(\'szukaj\')">'+I.back+' maszyny</span>'+
    '<div class="nm">'+esc(m.nazwa)+'</div><div class="meta">'+
    '<span class="reg">'+esc(m.rejestracja||'bez rejestracji')+'</span>'+
    '<span>'+esc(m.rodzaj||'')+'</span>'+
    (m.kierowca ? '<span>· '+esc(m.kierowca)+'</span>' : '')+'</div>'+
    /* VIN na karcie — tylko koparki, tak jak na liście */
    (czyKoparka_(m) && m.vin ? '<div class="vin">VIN '+esc(m.vin)+'</div>' : '')+'</div>';
  h += '<div class="terms">'+terminHTML('Badanie', m.terminy.badanie)+
       terminHTML('OC', m.terminy.oc)+terminHTML('UDT', m.terminy.udt)+
       terminHTML('Mienie', m.terminy.mienie)+'</div>';

  var spr = (dane.sprawy||[]).filter(function(s){ return s.id_pojazdu === m.id; });
  h += '<div class="h">Sprawy tej maszyny</div><div class="karta">';
  if (!spr.length) h += '<div class="pusto">Brak spraw — i dobrze.</div>';
  spr.forEach(function(s){
    h += '<div class="row" onclick="otworzSprawe(\''+s.id+'\')">'+
      '<div class="ic k-'+kodRodzaju(m.rodzaj)+'">'+I.wr+'</div>'+
      '<div class="mid"><div class="t1">'+esc(s.tytul||'')+'</div>'+
      '<div class="t2">'+esc(s.id)+' · '+esc(czasPL(s.utworzono))+'</div></div>'+pillStatus(s.status)+'</div>';
  });
  h += '</div>';

  if (dane.koszty){
    var rokTeraz = new Date().getFullYear(), suma = 0, ile = 0;
    (dane.koszty||[]).forEach(function(mi){
      if (mi.rok !== rokTeraz) return;
      var klucze = [m.rejestracja, m.nazwa];
      Object.keys(mi.maszyny||{}).forEach(function(k){
        if (klucze.indexOf(k) >= 0){ suma += mi.maszyny[k]; ile++; } });
    });
    h += '<div class="h">Koszty '+rokTeraz+'</div><div class="karta"><div class="big">'+zl(Math.round(suma*100)/100)+
      '</div><div class="fnote" style="text-align:left">'+(ile? 'suma z lustra kosztów (rok bieżący)' :
      'brak dopasowanych kosztów w tym roku')+'</div></div>';
  }
  el('ekranKarta').innerHTML = h;
}

/* ---------- SPRAWY + KARTA SPRAWY ---------- */
/* Z-10 (decyzja Marka z makiety, wariant C): kafelek sprawy prowadzi
   MASZYNĄ w konwencji wybieraka — klucz pogrubiony (rejestracja, a u koparek
   nazwa np. „Hidromek (1)"), pod spodem podpis (marka i model, u koparek VIN).
   Opis zwykłą czcionką, max 2 linie (pełny jest w karcie sprawy). Na dole
   numer sprawy i TERMIN, gdy jest. Plakietka: po terminie / termin dziś
   wygrywa ze statusem (jak dotąd). */
function dataKrotka_(iso){
  if (!iso) return '';
  var s = String(iso);
  return s.slice(8, 10) + '.' + s.slice(5, 7);
}
/* `opcje.pill` — gotowa plakietka zamiast domyślnej (Puls niesie tam POWÓD
   uwagi, nie status). `opcje.status` — dopisz status na dole, obok numeru
   (na Pulsie plakietka go nie pokazuje, a warto wiedzieć, na czym stoi). */
function kafelSprawy_(s, opcje){
  opcje = opcje || {};
  var m = maszynaSprawy(s), d = dniDo(s.termin), wToku = czyWToku(s.status);
  var pill = opcje.pill ||
             ((d !== null && d < 0 && wToku) ? '<span class="pill red">po terminie</span>'
           : (d === 0 && wToku) ? '<span class="pill amber">termin dziś</span>' : pillStatus(s.status));
  var klucz, podpis = '', vin = false;
  if (m){
    klucz = kluczMaszyny(m);
    podpis = podpisMaszyny(m);
    vin = czyKoparka_(m) && !!m.vin;
  } else {
    klucz = s.maszyna || 'maszyna nieznana';   /* tekst z arkusza, bez dopasowania */
  }
  var ter = '';
  if (s.termin && wToku){
    ter = '<span class="s-ter' + ((d !== null && d < 0) ? ' red' : '') + '">termin: ' +
          dataKrotka_(s.termin) + '</span>';
  }
  var stat = opcje.status ? '<span class="s-nr">' + esc(s.status) + '</span>' : '';
  /* Z-11: sprawa „Wykonane" nie ma już terminu do pilnowania — w jego miejsce
     pokazujemy, ile dni czeka na fakturę (i od kiedy). */
  if (!ter && s.status === 'Wykonane' && !s.nr_faktury){
    var dF = dniOd_(s.status_od);
    if (dF !== null) ter = '<span class="s-ter' + (dF > PROGI.faktura ? ' red' : '') +
      '">czeka na fakturę: ' + dF + ' dn.</span>';
  }
  return '<div class="row" onclick="otworzSprawe(\'' + s.id + '\')">' +
    '<div class="ic k-' + (m ? kodRodzaju(m.rodzaj) : 'inne') + '">' +
    ikonaRodzaju(m ? kodRodzaju(m.rodzaj) : 'inne') + '</div>' +
    '<div class="mid"><div class="g1"><span class="s-klucz">' + esc(klucz) + '</span>' + pill + '</div>' +
    (podpis ? '<div class="s-podpis' + (vin ? ' vin' : '') + '">' + esc(podpis) + '</div>' : '') +
    '<div class="s-opis">' + esc(s.tytul || '') + '</div>' +
    '<div class="g3"><span class="s-nr">' + esc(s.id) + '</span>' + stat + ter + '</div></div></div>';
}
/* Z-11: trzy filtry zamiast dwóch. „W toku" mieszało robotę z czekaniem
   na fakturę — teraz stan widać z samego filtra. */
var filtrSpraw = 'robocie';
function rysujSprawy(){
  if (!dane) return;
  var sp = dane.sprawy || [], skrz = skrzynkaCzekajaca_();   /* Z-9 */
  var lRobocie = sp.filter(function(s){ return czyWRobocie(s.status); }).length;
  var lRozlicz = sp.filter(czyDoRozliczenia).length;
  var h = '<div class="chips" style="margin-top:10px">'+
    '<button class="chip'+(filtrSpraw==='robocie'?' on':'')+'" onclick="ustawFiltrSpraw(\'robocie\')">W robocie'+
      (lRobocie?' · '+lRobocie:'')+'</button>'+
    '<button class="chip'+(filtrSpraw==='rozliczenie'?' on':'')+'" onclick="ustawFiltrSpraw(\'rozliczenie\')">Do rozliczenia'+
      (lRozlicz?' · '+lRozlicz:'')+'</button>'+
    '<button class="chip'+(filtrSpraw==='wszystkie'?' on':'')+'" onclick="ustawFiltrSpraw(\'wszystkie\')">Wszystkie</button></div>';

  var nowe = skrz.filter(function(w){ return w.rodzaj !== 'dopisek'; });
  if (nowe.length){
    h += '<div class="h">Świeże ze skrzynki · '+nowe.length+'</div><div class="karta">';
    nowe.forEach(function(w){
      h += '<div class="row" style="cursor:default"><div class="ic">'+I.sprawy+'</div><div class="mid">'+
        '<div class="t1">'+esc(w.maszyna||'Zgłoszenie')+(w.typ?' · '+esc(w.typ):'')+'</div>'+
        '<div class="t2">'+esc(w.s_id)+' · '+esc(w.kto||'')+' · '+esc((w.tresc||'').slice(0,80))+'</div></div>'+
        '<span class="pill amber">czeka</span></div>';
    });
    h += '<div class="fnote">status nada się przy przetwarzaniu — statusy wynikają z treści</div></div>';
  }

  var lista = sp.filter(function(s){
    if (filtrSpraw === 'wszystkie') return true;
    if (filtrSpraw === 'rozliczenie') return czyDoRozliczenia(s);
    return czyWRobocie(s.status);
  });
  lista.sort(function(a,b){
    var pa = dniDo(a.termin), pb = dniDo(b.termin);
    var wa = (pa!==null && pa<=0) ? pa : 999, wb = (pb!==null && pb<=0) ? pb : 999;
    if (wa!==wb) return wa-wb;
    return String(b.utworzono||'').localeCompare(String(a.utworzono||''));
  });
  var naglowek = filtrSpraw==='robocie' ? 'W robocie'
               : filtrSpraw==='rozliczenie' ? 'Do rozliczenia' : 'Wszystkie';
  h += '<div class="h">'+naglowek+' · '+lista.length+'</div><div class="karta">';
  if (!lista.length) h += '<div class="pusto">'+
    (filtrSpraw==='rozliczenie' ? 'Nic nie czeka na fakturę.' : 'Pusto.')+'</div>';
  lista.forEach(function(s){ h += kafelSprawy_(s); });
  h += '</div>';

var kosztyIdx = 0, kosztyKv = 'kat';
function rysujKoszty(){
  if (!dane) return;
  if (!dane.koszty){ el('ekranKoszty').innerHTML =
    '<div class="karta" style="margin-top:12px"><div class="pusto">Koszty widzą role Szef i Admin.</div></div>'; return; }
  var KOS = dane.koszty;
  if (kosztyIdx >= KOS.length) kosztyIdx = 0;
  var h = '<div class="seg">'+[['kat','Kategorie'],['masz','Maszyny'],['mies','Miesiące']].map(function(p){
    return '<button class="'+(kosztyKv===p[0]?'on':'')+'" onclick="ustawKoszty(\''+p[0]+'\')">'+p[1]+'</button>';
  }).join('')+'</div>';

  if (kosztyKv === 'mies'){
    h += '<div class="karta mlist">';
    KOS.forEach(function(mi, i){
      h += '<div class="mm" onclick="wybierzMiesiac('+i+')"><div>'+
        '<div class="n1">'+MIESIACE[mi.miesiac-1]+' '+mi.rok+'</div>'+
        '<div class="n2">'+mi.faktur+' pozycji</div></div>'+
        '<div class="kw">'+zl(mi.suma)+'</div></div>';
    });
    h += '</div><div class="fnote">koszty z lustra: rok bieżący + poprzedni · sumy liczy synchronizacja, nie telefon</div>';
  } else {
    var mi = KOS[kosztyIdx];
    h += '<div class="mon"><button onclick="krokMiesiac(1)" '+(kosztyIdx>=KOS.length-1?'disabled':'')+'>‹</button>'+
      '<span class="mn">'+MIESIACE[mi.miesiac-1].charAt(0).toUpperCase()+MIESIACE[mi.miesiac-1].slice(1)+' '+mi.rok+'</span>'+
      '<button onclick="krokMiesiac(-1)" '+(kosztyIdx<=0?'disabled':'')+'>›</button></div>';
    h += '<div class="karta"><div class="big">'+zl(mi.suma)+' <small>· '+mi.faktur+' pozycji</small></div>';
    var grupy = kosztyKv==='kat' ? mi.kategorie : mi.maszyny;
    var maxy = 0; Object.keys(grupy).forEach(function(k){ if (grupy[k]>maxy) maxy=grupy[k]; });
    var klucze = Object.keys(grupy);
    if (kosztyKv==='masz') klucze = klucze.slice(0, 14);
    klucze.forEach(function(k, i){
      var maszyna = kosztyKv==='masz' ? (dane.maszyny||[]).find(function(m){
        return m.rejestracja===k || m.nazwa===k; }) : null;
      var kl = maszyna ? 'c-'+kodRodzaju(maszyna.rodzaj) : (kosztyKv==='masz' ? 'c-none' : '');
      h += '<div class="krow"><div class="kl"><span>'+esc(k)+'</span><b>'+zl(grupy[k])+'</b></div>'+
        '<div class="ktr"><div class="kfl '+kl+'" style="--do:'+
        Math.max(4, Math.round(grupy[k]/maxy*100))+'%; --zwloka:'+(i*70)+'ms"></div></div></div>';
    });
    if (kosztyKv==='masz' && Object.keys(grupy).length > 14)
      h += '<div class="fnote">pokazuję 14 największych z '+Object.keys(grupy).length+'</div>';
    h += '</div>';
    if (kosztyKv==='masz') h += '<div class="fnote">paski w kolorach kategorii pojazdów</div>';
  }
  el('ekranKoszty').innerHTML = h;
}
function ustawKoszty(kv){ kosztyKv = kv; rysujKoszty(); }
function krokMiesiac(d){ kosztyIdx += d; rysujKoszty(); }

/* ---------- wybierak: otwieranie, „wstecz", lista ---------- */
function otworzWybierak(){
  wybOtwarty = true; wybSzukaj = ''; wybKat = '';
  rysujWybierak();
  el('wybMaszyn').classList.add('on');
  /* Telefonowy przycisk WSTECZ ma zamykać panel, a nie wychodzić z aplikacji.
     Natywny <select> robił to sam; własny panel musi o to zadbać. */

function zamknijWybierak(zHistorii){
  if (!wybOtwarty) return;

  if (!zHistorii && history.state && history.state.wybierak) history.back();
}

});
function wybierzMaszyne(id){

}

function rysujWybierak(){

function rysujWybChipy(){
  var obecne = {};
  (dane.maszyny||[]).forEach(function(m){ obecne[rangaTypu_(m.rodzaj)] = true; });
  var h = '<button type="button" class="chip'+(wybKat===''?' on':'')+'" data-kat="">Wszystkie</button>';
  Object.keys(obecne).sort().forEach(function(r){
    h += '<button type="button" class="chip'+(wybKat===r?' on':'')+'" data-kat="'+r+'">'+

function pasujeDoWyszukiwania_(m){
  if (wybKat && String(rangaTypu_(m.rodzaj)) !== wybKat) return false;
  var q = String(wybSzukaj||'').trim().toLowerCase().replace(/\s+/g,'');
  if (!q) return true;
  var stog = (kluczMaszyny(m)+' '+(m.nazwa||'')+' '+(m.vin||'')+' '+(m.rodzaj||''))
             .toLowerCase().replace(/\s+/g,'');
  return stog.indexOf(q) !== -1;
}
function rysujWybLista(){
  var lista = sortujMaszyny(dane.maszyny||[]).filter(pasujeDoWyszukiwania_);
  var box = el('wybLista');
  if (!lista.length){
    box.innerHTML = '<div class="nic">Nic nie pasuje do „'+esc(wybSzukaj)+'".<br>'+
      'Możesz zostawić maszynę pustą i opisać ją słowami.</div>';

  var h = '', ostatnia = null;

    if (kat !== ostatnia){ ostatnia = kat; h += '<div class="grupa">'+esc(kat)+'</div>'; }
    var kod = kodRodzaju(m.rodzaj), podpis = podpisMaszyny(m), vin = czyKoparka_(m) && m.vin;
    h += '<button type="button" class="crow k-'+kod+'" role="option" data-id="'+esc(m.id)+'">'+

      '</button>';
  });
  h += '<button type="button" class="crow k-brak" role="option" data-id="">'+
       '<span class="kl">Nie wiem / inna</span>'+
       '<span class="model">opiszę w treści</span></button>';
  box.innerHTML = h;
  box.onclick = function(e){
    var b = e.target.closest('[data-id]'); if (!b) return;
    wybierzMaszyne(b.getAttribute('data-id'));
  };

function kolejka(){ try{ return JSON.parse(ls(K.kolejka)||'[]'); }catch(e){ return []; } }
function zapiszKolejke(k){ lsSet(K.kolejka, JSON.stringify(k)); }
function kolejkaHTML(){
  var k = kolejka();
  if (!k.length) return '';
  var h = '';
  k.forEach(function(w, i){
    h += '<div class="kolejka-karta"><b>Niewysłane: '+esc(w.rodzaj==='dopisek'?'dopisek do '+(w.dotyczy||'sprawy'):'zgłoszenie')+'</b>'+
      esc((w.tresc||'').slice(0,90))+'…'+
      '<div class="k-akcje"><button class="k-btn" onclick="wyslijKolejke()">Spróbuj ponownie</button>'+
      '<button class="k-btn usun" onclick="usunZKolejki('+i+')">Usuń</button></div></div>';
  });
  return h;
}
function usunZKolejki(i){
  var k = kolejka(); k.splice(i,1); zapiszKolejke(k); rysujPuls();
}
function dodajDoKolejki(wpis){
  var k = kolejka(); k.push(wpis); zapiszKolejke(k);
}
var trwaKolejka = false;
function wyslijKolejke(){
  if (trwaKolejka) return;
  var k = kolejka();
  if (!k.length || !navigator.onLine) return;
  trwaKolejka = true;
  var w = k[0];
  api({ kod: ls(K.kod), akcja:'zglos', rodzaj:w.rodzaj, dotyczy:w.dotyczy,
        maszyna:w.maszyna, typ:w.typ, tresc:w.tresc, klucz:w.klucz })
  .then(function(d){
    trwaKolejka = false;
    if (d.ok){ var k2 = kolejka(); k2.shift(); zapiszKolejke(k2);
      pobierzDane(true); rysujPuls();
      if (k2.length) wyslijKolejke(); }
  }).catch(function(){ trwaKolejka = false; });
}

var komTrwaly = null;   /* komunikat ma przezyc ciche przerysowanie ekranu */
